<style>
/* Layout: sidebar de blocos (trilha) + área de estudo com abas Aula · Exemplo guiado · Questões */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#15211e; --muted:#5b6a66; --line:#d6dedb;
  --petrol:#0f5b52; --petrol-soft:#e1efec; --amber:#b86e00; --amber-soft:#fff2db;
  --red:#b3261e; --red-soft:#fde8e6; --green:#1f7a3a; --green-soft:#e3f4e7;
  --fig-bg:#ffffff;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --paper:#161f1d; --ink:#e3ece9; --muted:#9db0ab; --line:#2b3835;
  --petrol:#5cc3b3; --petrol-soft:#16302c; --amber:#f0b24f; --amber-soft:#33270f;
  --red:#ff8a80; --red-soft:#3a1916; --green:#7ad493; --green-soft:#15301d; --fig-bg:#f4f6f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --paper:#161f1d; --ink:#e3ece9; --muted:#9db0ab; --line:#2b3835;
  --petrol:#5cc3b3; --petrol-soft:#16302c; --amber:#f0b24f; --amber-soft:#33270f;
  --red:#ff8a80; --red-soft:#3a1916; --green:#7ad493; --green-soft:#15301d; --fig-bg:#f4f6f5; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
sub,sup{line-height:0}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--paper);padding:20px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.brand h1{font-size:1.35rem;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.overall{margin:10px 0 16px;font-size:.82rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--petrol)}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.blist button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.blist button:hover{background:var(--petrol-soft)}
.blist button[aria-current="true"]{background:var(--petrol-soft);font-weight:600}
.blist .bn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.blist .bt{font-size:.92rem;line-height:1.3}
.blist .bp{grid-column:2;font-size:.74rem;color:var(--muted)}
.mobile-nav{display:none}

.main{padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px);min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol)}
.bhead{display:flex;flex-direction:column;gap:8px}
.bhead h2{font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.015em}
.bhead p{margin:0;color:var(--muted);max-width:65ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--petrol)}

.prose{max-width:68ch}
.prose h3{font-size:1.2rem;margin:26px 0 8px}
.prose p,.prose li{margin:0 0 10px}
.prose ul{padding-left:20px;margin:0 0 12px}
.formula{font-family:var(--f-mono);background:var(--petrol-soft);border-radius:8px;padding:10px 14px;margin:10px 0 14px;overflow-x:auto;font-size:.92rem;line-height:1.7}
.trap{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.trap b{color:var(--amber)}
.goal{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.goal ul{margin:0;padding-left:20px}

.mat{display:inline-table;border-collapse:collapse;vertical-align:middle;margin:2px 4px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:4px}
.mat td{padding:1px 7px;text-align:center;font-family:var(--f-mono);font-size:.9em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* exemplo guiado */
.step{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.step .sq{font-weight:600}
.step .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step input[type=text]{flex:1 1 180px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:var(--f-mono)}
.locked{opacity:.55}

/* questões */
.qtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}
.qtools select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:20px}
.q.ok{border-color:var(--green)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:.74rem;padding:3px 8px;border-radius:99px;background:var(--petrol-soft);color:var(--petrol);letter-spacing:.03em}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.try{background:var(--amber-soft);color:var(--amber)}
.enun p{margin:0 0 8px}
.figs{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.figs img{background:var(--fig-bg);border-radius:8px;padding:8px;border:1px solid var(--line);max-width:100%;height:auto}
.ops{display:flex;flex-direction:column;gap:6px}
.op{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.op input{position:absolute;opacity:0;pointer-events:none}
.op .L{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.op:has(input:checked){border-color:var(--petrol);box-shadow:0 0 0 1px var(--petrol) inset}
.op:has(input:focus-visible){outline:2px solid var(--petrol);outline-offset:2px}
.op.elim{opacity:.6;text-decoration:line-through;text-decoration-color:var(--red);cursor:not-allowed}
.op.right{border-color:var(--green);background:var(--green-soft)}
.vfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.vfrow .seg{display:flex;gap:4px}
.vfrow .seg button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 12px;font-weight:700}
.vfrow .seg button[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:var(--paper)}
.vfrow.bad{border-color:var(--red)}
.vfrow.good{border-color:var(--green)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--petrol)}
.btn.pri{background:var(--petrol);border-color:var(--petrol);color:var(--paper)}
.btn.warn{color:var(--amber);border-color:var(--amber)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.err{background:var(--red-soft);border:1px solid var(--red)}
.fb.err .t{color:var(--red);font-weight:700}
.fb.hint{background:var(--amber-soft);border:1px solid var(--amber)}
.fb.hint .t{color:var(--amber);font-weight:700}
.fb.ok{background:var(--green-soft);border:1px solid var(--green)}
.fb.ok .t{color:var(--green);font-weight:700}
.fb.note{background:var(--petrol-soft);border:1px solid var(--line)}
.fb p{margin:0}
.res{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.res h4{font-size:1rem}
.res ol{margin:0;padding-left:20px}
.whyno{font-size:.92rem;color:var(--muted)}
.whyno b{color:var(--ink)}
.ai{display:flex;flex-direction:column;gap:8px}
.ai textarea{width:100%;min-height:90px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.ai .out{white-space:pre-wrap;background:var(--petrol-soft);border-radius:10px;padding:12px 14px}
.aviso{border:1px dashed var(--amber);border-radius:10px;padding:10px 14px;font-size:.92rem}
.aviso b{color:var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.empty{color:var(--muted);font-style:italic}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobile-nav{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .mobile-nav select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .q{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.fb,.res{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
[hidden]{display:none!important}
.figs img{max-width:min(100%,560px)}

<script>
window.QS = {}; window.BLOCOS = [];
function Q(id, o){ if (window.QS[id]) throw new Error("questão duplicada " + id); window.QS[id] = o; }
function B(o){ window.BLOCOS.push(o); }
/* matriz: M("1 2;3 4") */
function M(s){ return '<table class="mat"><tbody>' + s.split(";").map(r => "<tr>" + r.trim().split(/\s+/).map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table>"; }
/* fração: FR("a","b") */
function FR(a, b){ return '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; }
function P(t){ return "<p>" + t + "</p>"; }
function F(t){ return '<div class="formula">' + t + '</div>'; }
function TRAP(t){ return '<div class="trap"><b>Armadilha comum:</b> ' + t + '</div>'; }
function OL(arr){ return "<ol>" + arr.map(x => "<li>" + x + "</li>").join("") + "</ol>"; }

B({
id:"b01", titulo:"Circuitos CC e análise de redes",
sub:"Kirchhoff, análise nodal, Thévenin/Norton, pontes e redes infinitas. É a base de quase todas as contas da prova.",
objetivos:["Montar equações de nó (KCL) e de malha (KVL) sem errar sinal","Calcular R<sub>th</sub> e V<sub>th</sub> de qualquer rede resistiva","Reconhecer uma ponte equilibrada e um curto que divide o circuito","Montar a matriz de admitância nodal Y por inspeção","Resolver redes em escada infinitas pela auto-semelhança"],
qs:["11-33","11-38","18-43","18-44","18-61","18-70","23-44","11-34","23-62"],
aula:
"<h3>1. As duas leis que resolvem tudo</h3>"+
P("<b>KCL (Lei dos nós):</b> a soma das correntes que saem de um nó é zero. <b>KVL (Lei das malhas):</b> a soma das tensões ao longo de um caminho fechado é zero. Toda técnica (nodal, Thévenin, superposição) é só uma forma organizada de aplicar essas duas leis.")+
F("Análise nodal: escolha um nó de referência (terra) e escreva, para cada nó k:<br>Σ (V<sub>k</sub> − V<sub>j</sub>)/R<sub>kj</sub> = correntes de fontes que ENTRAM no nó k")+
TRAP("fonte de corrente em paralelo com um resistor não muda a corrente da fonte; e um resistor em série com uma fonte de corrente é irrelevante para o resto do circuito (a corrente já está imposta).")+
"<h3>2. Thévenin e Norton</h3>"+
P("Qualquer rede linear vista de dois terminais equivale a uma fonte V<sub>th</sub> em série com R<sub>th</sub> (ou I<sub>N</sub> = V<sub>th</sub>/R<sub>th</sub> em paralelo com R<sub>th</sub>).")+
"<ul><li><b>V<sub>th</sub></b>: tensão em aberto nos terminais (sem a carga).</li><li><b>R<sub>th</sub></b>: desligue as fontes independentes (fonte de tensão vira <b>curto</b>, fonte de corrente vira <b>aberto</b>) e calcule a resistência vista dos terminais.</li><li><b>Transformação de fontes:</b> V em série com R ⇔ V/R em paralelo com R. Útil para juntar fontes em paralelo (somam correntes) e resistências em paralelo.</li><li><b>Máxima transferência de potência:</b> R<sub>carga</sub> = R<sub>th</sub>, e P<sub>máx</sub> = V<sub>th</sub>²/(4R<sub>th</sub>).</li></ul>"+
"<h3>3. Pontes e curtos</h3>"+
P("Ponte de Wheatstone com braços R<sub>1</sub>, R<sub>2</sub> (de um lado) e R<sub>3</sub>, R<sub>4</sub> (do outro) está <b>equilibrada</b> quando R<sub>1</sub>/R<sub>2</sub> = R<sub>3</sub>/R<sub>4</sub>: o resistor central não conduz e pode ser removido. Se em vez de resistor central houver um <b>fio</b>, os dois nós viram um só: os braços ficam em paralelo dois a dois.")+
"<h3>4. Matriz de admitância nodal</h3>"+
F("Y<sub>kk</sub> = soma de todas as admitâncias ligadas ao nó k<br>Y<sub>kj</sub> = − (admitância entre os nós k e j)")+
"<h3>5. Redes infinitas (escada)</h3>"+
P("Se a rede é infinita, retirar a primeira célula deixa a mesma rede. Chame o equivalente de X, escreva X em função da primeira célula ligada a X e resolva a equação do 2º grau. Para capacitores lembre: em <b>paralelo somam</b>, em <b>série</b> combinam como resistores em paralelo (C<sub>1</sub>C<sub>2</sub>/(C<sub>1</sub>+C<sub>2</sub>)).")+
TRAP("em regime permanente CC, capacitor = circuito aberto e indutor = curto. Questões com capacitor \"3 F\" ou indutor em regime CC querem só ver se você sabe isso."),
exemplo:{
 titulo:"Exemplo: Thévenin passo a passo",
 enun:P("Uma fonte de 24 V tem em série um resistor de 6 Ω. Depois dele há um resistor de 3 Ω ligado à referência (em paralelo com a saída) e, em seguida, um resistor de 2 Ω em série até o terminal a. O terminal b é a referência. Uma carga R<sub>L</sub> será ligada entre a e b."),
 passos:[
  {p:"Com a carga desligada, qual a tensão V<sub>th</sub> entre a e b (em V)?", v:8, r:"Sem carga, o 2 Ω não conduz. A tensão em a é a tensão do 3 Ω: divisor 24·3/(6+3) = <b>8 V</b>.", dica:"Sem carga, passa corrente no resistor de 2 Ω? Então a tensão em a é a do resistor de 3 Ω (divisor de tensão entre 6 Ω e 3 Ω)."},
  {p:"Desligando a fonte (curto), qual R<sub>th</sub> vista de a-b (em Ω)?", v:4, r:"6 Ω ∥ 3 Ω = 2 Ω; somando o 2 Ω em série: <b>R<sub>th</sub> = 4 Ω</b>.", dica:"Fonte de tensão desligada vira curto. Então 6 Ω fica em paralelo com 3 Ω, e esse conjunto fica em série com o 2 Ω."},
  {p:"Com R<sub>L</sub> = 4 Ω, qual a corrente na carga (em A)?", v:1, r:"I = V<sub>th</sub>/(R<sub>th</sub>+R<sub>L</sub>) = 8/8 = <b>1 A</b>.", dica:"Use o equivalente: uma fonte V<sub>th</sub> em série com R<sub>th</sub> e a carga."},
  {p:"Qual a potência na carga (em W)? Ela é a máxima possível?", v:4, r:"P = I²R<sub>L</sub> = 1·4 = <b>4 W</b>. É a máxima, porque R<sub>L</sub> = R<sub>th</sub>: P<sub>máx</sub> = V<sub>th</sub>²/(4R<sub>th</sub>) = 64/16 = 4 W.", dica:"P = I²R. Compare R<sub>L</sub> com R<sub>th</sub>."}
 ],
 fecho:"Esse roteiro (V<sub>th</sub> em aberto → R<sub>th</sub> com fontes desligadas → circuito equivalente) resolve as questões 18-43, 18-44, 18-70 e 23-44 do bloco."
}
});

Q("11-33",{
enun:P("Para o circuito apresentado na figura, o valor da tensão V<sub>x</sub>, em volts, é"),
fig:"f11_33", ops:["−4","0","4","8","12"], gab:"A",
aviso:"o sinal depende da convenção da seta. Aqui vale a convenção usual da banca: a ponta da seta indica o terminal de referência positiva de V<sub>x</sub>.",
dicas:["A fonte de 10 V e os resistores de 2 Ω e 1 Ω não interferem na corrente do resistor de 4 Ω. Olhe só para o nó da direita (topo da fonte de 3 A).","KCL no nó da direita: entram 3 A pela fonte de baixo; saem 2 A pela fonte de cima. O que sobra tem de passar pelo 4 Ω, da direita para a esquerda."],
erros:{
B:"Você tratou as fontes de corrente como se não impusessem nada ao resistor de 4 Ω. Faça o balanço de correntes no nó da direita: a diferença entre o que entra e o que sai pelas fontes precisa passar pelo 4 Ω.",
C:"O módulo está certo: há 4 V sobre o resistor de 4 Ω. O erro é de sinal. Descubra qual extremidade do 4 Ω está em potencial mais alto (a corrente de 1 A vai de qual lado para qual?) e compare com o terminal para onde a seta de V<sub>x</sub> aponta.",
D:"8 V corresponderia a 2 A no resistor de 4 Ω. Você usou só uma das fontes de corrente. Pelo nó da direita passam as duas fontes; refaça o KCL ali.",
E:"12 V = 3 A × 4 Ω: você mandou toda a corrente da fonte de 3 A pelo resistor e esqueceu que parte dela sai pela fonte de 2 A."},
res:OL(["Nó da direita (R): entram 3 A (fonte de baixo) e saem 2 A pela fonte de cima, cuja seta aponta para a esquerda.","KCL: 3 = 2 + I<sub>4Ω</sub> ⇒ I<sub>4Ω</sub> = 1 A, da direita para a esquerda.","V<sub>R</sub> − V<sub>L</sub> = 4 Ω × 1 A = 4 V: o lado direito é o mais positivo.","A seta de V<sub>x</sub> aponta para a esquerda (terminal L), então V<sub>x</sub> = V<sub>L</sub> − V<sub>R</sub> = <b>−4 V</b>."])+P("Repare que a fonte de 10 V só define as tensões absolutas dos nós; a diferença no 4 Ω é imposta pelas fontes de corrente.")
});

Q("11-38",{
enun:P("A figura apresenta um circuito elétrico puramente resistivo, alimentado por uma fonte CC de 20 V. As correntes nos trechos entre os pontos A-B, C-A e B-D são, respectivamente, em ampères, iguais a"),
fig:"f11_38", ops:["0,5 ; 0 e 0","0,5 ; 0 e 0,5","0 ; 0,33 e 0,5","0 ; 0,16 e 0,33","0,5 ; 0,16 e 0,33"], gab:"D",
dicas:["O traço vertical entre A e B é um fio (resistência zero). Então A e B são o mesmo nó.","Com A = B, os resistores de 20 Ω e 10 Ω (que saem de C) ficam em paralelo; os de 40 Ω e 20 Ω (que chegam em D) também. Ache a corrente total e divida.","Para saber a corrente no fio A-B, faça KCL no nó A: compare o que chega de C pelo 20 Ω com o que sai para D pelo 40 Ω."],
erros:{
A:"Você imaginou que toda a corrente da fonte passa pelo fio A-B. Mas as correntes de C chegam tanto em A quanto em B, e saem tanto de A quanto de B para D. Calcule o que entra e o que sai do nó A.",
B:"A corrente no fio A-B não é a corrente total. E C-A não pode ser zero: há 20 Ω ligando C a A com diferença de potencial. Junte A e B num único nó e refaça.",

Q("23-62",{
enun:P("Uma linha de transmissão pode ser modelada como uma malha infinita de capacitores, todos de capacitância C, arranjados conforme a figura. A capacitância equivalente entre os pontos A e B é"),
fig:"f23_62", ops:["C(1+√2)/2","C(1+√3)/2","C(1+√3)/4","C(1+2√2)/4","C(1+3√2)/4"], gab:"B",
dicas:["Logo na entrada há um capacitor C ligado direto entre A e B. Depois dele, há um capacitor em série na linha de cima e outro na de baixo, e então a rede se repete.","Chame de X o equivalente. Retirando a primeira célula sobra a mesma rede X. Então X = C + [ (C/2) em série com X ]."],
erros:{
A:"(1+√2) aparece quando a célula tem só UM capacitor em série. Aqui há um capacitor em série em cima e outro embaixo: juntos valem C/2.",
C:"Confira a equação: X = C + (C/2)·X/(C/2 + X). Dividindo por C, x = 1 + x/(1+2x). Resolva o 2º grau com cuidado.",
D:"Você deve ter montado a equação com os capacitores em série somando (como resistores em série). Capacitores em série combinam pelo produto sobre a soma.",

res:OL(["Primeira célula: C em paralelo (entre A e B) com o ramo [C em cima + resto + C embaixo].","Os dois capacitores em série (cima e baixo) equivalem a C/2, em série com o resto da rede X.","X = C + (C/2)·X/(C/2 + X). Com x = X/C: x = 1 + x/(1 + 2x).","x(1 + 2x) = 1 + 3x ⇒ 2x² − 2x − 1 = 0 ⇒ x = (2 + √12)/4 = (1 + √3)/2.","<b>C<sub>eq</sub> = C(1 + √3)/2</b>."])
});

B({
id:"b02", titulo:"Circuitos CA: fasores, potência e valor eficaz",
sub:"Impedância, triângulo de potências, correção do fator de potência, valor eficaz e potência média de sinais periódicos.",
objetivos:["Transformar um circuito senoidal em fasores e impedâncias","Usar S = P + jQ, S = V·I* e o fator de potência","Dimensionar o capacitor que corrige o fator de potência","Calcular valor eficaz e potência média de formas de onda não senoidais","Ler um diagrama fasorial (adiantado/atrasado, regulação)"],
qs:["06-22","18-31","23-33","23-52","23-51","18-27","08-26","23-63","08-33"],
aula:
"<h3>1. Fasores e impedância</h3>"+
P("Em regime senoidal com frequência ω = 2πf, cada grandeza vira um número complexo (fasor). Os elementos viram impedâncias:")+
F("Z<sub>R</sub> = R &nbsp;&nbsp; Z<sub>L</sub> = jωL = jX<sub>L</sub> &nbsp;&nbsp; Z<sub>C</sub> = 1/(jωC) = −jX<sub>C</sub><br>V = Z·I (Ohm vale com complexos) &nbsp;&nbsp; |Z| = √(R² + X²), ângulo φ = arctg(X/R)")+
P("O ângulo da impedância é a defasagem entre tensão e corrente (φ = θ<sub>V</sub> − θ<sub>I</sub>). Ele não depende do ângulo da fonte. Indutivo: corrente atrasada (φ &gt; 0). Capacitivo: corrente adiantada (φ &lt; 0).")+
TRAP("ler a frequência. Questões dão 50 Hz ou 40 Hz de propósito para quem usa 377 rad/s no automático.")+
"<h3>2. Potências</h3>"+
F("S = V<sub>ef</sub>·I<sub>ef</sub>* = P + jQ &nbsp;&nbsp; |S| = V·I (VA)<br>P = V·I·cos φ (W) &nbsp;&nbsp; Q = V·I·sen φ (var) &nbsp;&nbsp; FP = cos φ = P/|S|<br>Com valores de pico: P = (V<sub>m</sub>·I<sub>m</sub>/2)·cos(θ<sub>V</sub> − θ<sub>I</sub>)")+
P("Para uma impedância: |Z| = V²/|S| e P = I²R, Q = I²X.")+
"<h3>3. Correção do fator de potência</h3>"+
P("Um capacitor em paralelo fornece Q<sub>C</sub> = V²·ωC sem mudar P. Para ir do FP<sub>1</sub> ao FP<sub>2</sub>:")+
F("Q<sub>C</sub> = P·(tg φ<sub>1</sub> − tg φ<sub>2</sub>) &nbsp;&nbsp; C = Q<sub>C</sub>/(ω·V²)<br>Para FP unitário: Q<sub>C</sub> = Q<sub>carga</sub>")+
"<h3>4. Valor eficaz e potência média de sinais periódicos</h3>"+
F("V<sub>ef</sub>² = (1/T)∫v²dt &nbsp;&nbsp; P<sub>média</sub> num resistor = V<sub>ef</sub>²/R = (1/T)∫(v²/R)dt")+
"<ul><li>Senoide: V<sub>ef</sub> = V<sub>p</sub>/√2.</li><li>Onda quadrada ±S: V<sub>ef</sub> = S (o quadrado é sempre S²).</li><li>Sinal em degraus: média ponderada dos quadrados pelos tempos.</li></ul>"+
TRAP("potência média NÃO é (tensão média)²/R. Primeiro eleve ao quadrado, depois faça a média.")+
"<h3>5. Energia</h3>"+
P("Energia = ∫p(t)dt. Se p está em W e t em horas, a energia sai em Wh. Para resistor não linear, use p = u(i)·i, e não u²/R.")+
"<h3>6. Diagrama fasorial de um gerador com cabo</h3>"+
F("E = V<sub>T</sub> + R·I + jX·I &nbsp;&nbsp; (a queda jXI fica 90° ADIANTADA de I)")+
P("Carga capacitiva (I adiantada de V<sub>T</sub>) pode fazer |E| &lt; |V<sub>T</sub>|: regulação negativa."),
exemplo:{
 titulo:"Exemplo: corrigindo o fator de potência",
 enun:P("Uma carga monofásica em 220 V, 60 Hz, consome 4,4 kW com FP 0,8 indutivo. Queremos FP unitário com um capacitor em paralelo."),
 passos:[
  {p:"Qual a potência aparente |S| da carga (em kVA)?", v:5.5, r:"|S| = P/FP = 4,4/0,8 = <b>5,5 kVA</b>.", dica:"FP = P/|S|."},
  {p:"Qual a potência reativa Q da carga (em kvar)?", v:3.3, r:"Q = √(5,5² − 4,4²) = <b>3,3 kvar</b> (ou P·tg φ com sen φ = 0,6).", dica:"Triângulo de potências: |S|² = P² + Q²."},
  {p:"Qual a corrente da carga antes da correção (em A)?", v:25, r:"I = |S|/V = 5500/220 = <b>25 A</b>.", dica:"I = |S|/V em circuito monofásico."},
  {p:"Qual a capacitância necessária (em µF)?", v:180.9, tol:0.03, r:"C = Q/(ωV²) = 3300/(377·220²) = 3300/18,25·10⁶ ≈ <b>181 µF</b>.", dica:"Q<sub>C</sub> = ωCV². Use ω = 2π·60 = 377 rad/s e V = 220 V. Converta para µF no fim."},
  {p:"E a corrente da fonte depois da correção (em A)?", v:20, r:"Agora |S| = P = 4,4 kVA ⇒ I = 4400/220 = <b>20 A</b>. A corrente cai 20% só por cancelar os reativos.", dica:"Com FP = 1, |S| = P."}
 ],
 fecho:"A questão 06-22 é exatamente isto, mas em 50 Hz. Preste atenção na frequência."
}
});

Q("23-51",{
enun:P("Um circuito monofásico é composto por uma fonte E<sub>A</sub> conectada a uma carga por meio de um cabo de impedância Z. A carga opera com tensão terminal V<sub>φ</sub> e corrente I<sub>L</sub>: E<sub>A</sub> = 150,0∠90° V, V<sub>φ</sub> = 120,0∠0° V, I<sub>L</sub> = 10,0∠45° A. A resistência do cabo, em Ω, é"),
ops:["1,5","1,5√2","1,5√3","7,5√2","6,0√3"], gab:"B",
dicas:["KVL: E<sub>A</sub> = V<sub>φ</sub> + Z·I<sub>L</sub> ⇒ Z = (E<sub>A</sub> − V<sub>φ</sub>)/I<sub>L</sub>.","E<sub>A</sub> − V<sub>φ</sub> = j150 − 120. Divida pelo fasor 10∠45° e tome a parte real."],
erros:{

});

B({
id:"b03", titulo:"Sistemas trifásicos e medição",
sub:"Ligações Y e Δ, sequência de fases, potência trifásica, wattímetros (Blondel e Aron), TCs e instrumentos.",
objetivos:["Converter grandezas de linha e de fase em Y e em Δ","Achar o fasor de corrente de qualquer fase sabendo a sequência (ABC ou ACB)","Calcular corrente de linha de um motor a partir de potência, rendimento e FP","Interpretar leituras de wattímetros (método dos dois e dos três wattímetros)","Converter leituras de TC e escolher o instrumento certo"],
qs:["23-39","23-34","06-23","11-27","23-42","23-41","23-35"],
aula:
"<h3>1. Linha × fase</h3>"+
F("Estrela (Y): V<sub>L</sub> = √3·V<sub>F</sub>, I<sub>L</sub> = I<sub>F</sub>, V<sub>L</sub> adiantada 30° de V<sub>F</sub> (seq. ABC)<br>Triângulo (Δ): V<sub>L</sub> = V<sub>F</sub>, I<sub>L</sub> = √3·I<sub>F</sub><br>Potência: S<sub>3φ</sub> = √3·V<sub>L</sub>·I<sub>L</sub> = 3·V<sub>F</sub>·I<sub>F</sub> &nbsp;&nbsp; P<sub>3φ</sub> = √3·V<sub>L</sub>·I<sub>L</sub>·cos φ")+
P("No diagrama unifilar (por fase), usa-se o <b>equivalente estrela</b>: tensão de fase (fase-neutro), corrente de linha e a impedância por fase do Y (uma carga em Δ vira Z<sub>Y</sub> = Z<sub>Δ</sub>/3).")+
"<h3>2. Sequência de fases</h3>"+
P("<b>ABC (positiva):</b> B atrasada 120° de A, C adiantada 120°. <b>ACB (negativa):</b> B adiantada 120° de A, C atrasada. Em carga equilibrada, a corrente de cada fase tem o mesmo módulo e o mesmo ângulo φ em relação à sua tensão de fase.")+
TRAP("o enunciado diz \"sequência ACB\" justamente para pegar quem subtrai 120° no automático.")+
"<h3>3. Corrente de motor</h3>"+
F("P<sub>saída</sub> (eixo) → P<sub>entrada</sub> = P<sub>saída</sub>/η → I<sub>L</sub> = P<sub>entrada</sub>/(√3·V<sub>L</sub>·cos φ)<br>1 HP = 746 W (dado na questão); 1 CV = 736 W")+
"<h3>4. Wattímetros</h3>"+
"<ul><li><b>Teorema de Blondel:</b> num sistema de n fios, n − 1 wattímetros com as bobinas de tensão referidas a um ponto comum medem a potência total. Com n wattímetros referidos a um ponto qualquer, a soma também dá a potência total.</li><li><b>Dois wattímetros (Aron), carga equilibrada:</b> W<sub>1</sub> = V<sub>L</sub>I<sub>L</sub>cos(30° + φ), W<sub>2</sub> = V<sub>L</sub>I<sub>L</sub>cos(30° − φ). Os ângulos que aparecem nas leituras são 30° ± φ.</li><li>Também vale: tg φ = √3·(W<sub>2</sub> − W<sub>1</sub>)/(W<sub>2</sub> + W<sub>1</sub>).</li></ul>"+
"<h3>5. TC e instrumentos</h3>"+
P("TC 400-5 A: relação 80. Corrente primária = corrente secundária × 80. Voltímetro mede diferença de potencial em paralelo, sem abrir o circuito; amperímetro vai em série; alicate amperímetro mede a corrente pelo campo magnético, sem abrir o circuito; ponte de Wheatstone mede resistência."),
exemplo:{
 titulo:"Exemplo: da plaqueta do motor à corrente de linha",

  {p:"Qual a potência elétrica absorvida da rede (em kW)?", v:16.67, r:"P<sub>entrada</sub> = 15/0,9 = <b>16,67 kW</b>.", dica:"O rendimento divide: a rede fornece mais do que o eixo entrega."},
  {p:"Qual a corrente de linha (em A)?", v:29.8, tol:0.03, r:"I = 16 667/(√3·380·0,85) = 16 667/559,4 ≈ <b>29,8 A</b>.", dica:"I = P/(√3·V<sub>L</sub>·FP)."},
  {p:"Qual o ângulo φ da corrente da fase A em relação à tensão de fase A (em graus, positivo)?", v:31.8, tol:0.03, r:"φ = arccos 0,85 ≈ <b>31,8°</b>, com a corrente atrasada (motor é indutivo): I<sub>A</sub> = 29,8∠−31,8° A.", dica:"φ = arccos(FP)."},
  {p:"Qual o ângulo (em graus) da corrente da fase B, em sequência ABC? (escreva o número com sinal)", v:-151.8, tol:0.01, r:"Em ABC, B está 120° atrás de A: −31,8° − 120° = <b>−151,8°</b>. Se fosse ACB, seria −31,8° + 120° = +88,2°.", dica:"Em ABC a fase B atrasa 120° em relação à A."}
 ],
 fecho:"Na questão 23-34 a sequência é ACB: use a regra do último passo ao contrário."
}

Q("23-39",{
enun:P("O diagrama unifilar tem a finalidade de simplificar a diagramação de um sistema elétrico. Nele, as cargas são representadas por uma única fase, onde as tensões, corrente e impedância fazem referência às tensões"),
ops:["de linha, corrente de linha e impedância de uma das fases da carga para carga na configuração estrela ou no seu equivalente estrela para as cargas na configuração delta.","de linha, corrente de linha e uma das impedâncias que compõem a carga trifásica para carga na configuração estrela ou na configuração delta.","de linha, corrente de linha e uma das impedâncias que compõem a carga trifásica na configuração estrela ou tensões de linha, corrente de fase e uma das impedâncias que compõem a carga trifásica no seu equivalente estrela para as cargas na configuração delta.","de linha, corrente de linha e uma das impedâncias que compõem a carga trifásica na configuração estrela ou tensões de fase, corrente de fase e uma das impedâncias que compõem a carga trifásica no seu equivalente estrela para as cargas na configuração delta.","de fase, corrente de fase e impedância de uma das fases da carga para carga na configuração estrela ou no seu equivalente estrela para as cargas na configuração delta."], gab:"E",
dicas:["O circuito por fase é sempre o de UMA fase do equivalente estrela: fonte fase-neutro, impedância por fase, corrente da fase.","Num Y, corrente de fase = corrente de linha. E a carga em Δ entra pelo seu equivalente Y."],
erros:{
A:"A impedância e a ideia do equivalente estrela estão certas, mas a tensão do circuito por fase é a de FASE (fase-neutro), não a de linha.",
B:"No circuito por fase não se usa a impedância do Δ diretamente nem a tensão de linha; converte-se o Δ em Y e usa-se tensão fase-neutro.",
C:"Misturar tensão de linha com o equivalente Y não fecha a lei de Ohm por fase: V<sub>L</sub>/Z<sub>Y</sub> dá √3 vezes a corrente real.",
D:"Para a carga em estrela, a alternativa usa tensão de linha. O circuito por fase usa tensão fase-neutro nos dois casos."},
res:P("O diagrama unifilar é o circuito de uma fase do sistema equivalente em estrela: tensão de <b>fase</b> (fase-neutro), corrente de fase (que no Y é igual à de linha) e a impedância por fase do Y. Cargas em Δ entram pelo equivalente Y (Z<sub>Y</sub> = Z<sub>Δ</sub>/3). Alternativa E.")
});

Q("23-35",{

B({

objetivos:["Calcular Z<sub>base</sub> e I<sub>base</sub> a partir de S<sub>base</sub> e V<sub>base</sub>","Mudar a impedância de uma base para outra sem errar a ordem das razões","Propagar a tensão de base pelos transformadores de um sistema","Montar o circuito em pu e calcular correntes"],
qs:["06-24","11-21","18-33","23-37","23-56","11-29"],
aula:
"<h3>1. Definições</h3>"+
F("valor em pu = valor real / valor de base<br>Z<sub>base</sub> = V<sub>base</sub>²/S<sub>base</sub> &nbsp;&nbsp; (kV² / MVA dá Ω)<br>I<sub>base</sub> = S<sub>base</sub>/(√3·V<sub>base</sub>) &nbsp;&nbsp; (trifásico, V de linha)")+
P("Em pu, a impedância de um transformador é a mesma vista de qualquer lado, e as tensões nominais viram 1 pu.")+
"<h3>2. Mudança de base</h3>"+
F("Z<sub>pu,nova</sub> = Z<sub>pu,velha</sub> · (S<sub>nova</sub>/S<sub>velha</sub>) · (V<sub>velha</sub>/V<sub>nova</sub>)²")+
P("Memorize pela intuição: Z<sub>pu</sub> = Z/Z<sub>base</sub> e Z<sub>base</sub> = V²/S. Se a potência de base AUMENTA, Z<sub>base</sub> diminui e o pu AUMENTA. Se a tensão de base AUMENTA, Z<sub>base</sub> aumenta e o pu DIMINUI (ao quadrado).")+
TRAP("inverter as razões. Teste sempre: base de potência maior ⇒ pu maior.")+
"<h3>3. Escolhendo bases num sistema</h3>"+
OL(["Uma única S<sub>base</sub> para o sistema todo.","Escolha a V<sub>base</sub> num trecho e propague pelos transformadores usando a relação de espiras nominal: do lado de 500 kV para o lado de 100 kV de um trafo 100/500 kV, a base cai 5 vezes.","Converta cada equipamento para as bases do trecho onde ele está.","Tensões de fonte também viram pu: 25 kV numa base de 100 kV são 0,25 pu."])+
"<h3>4. Impedância de carga em pu</h3>"+
P("Uma carga de S<sub>n</sub> a V<sub>n</sub> tem Z = V<sub>n</sub>²/S<sub>n</sub>. Em pu na base (S<sub>b</sub>, V<sub>b</sub>): Z<sub>pu</sub> = (S<sub>b</sub>/S<sub>n</sub>)·(V<sub>n</sub>/V<sub>b</sub>)².")+
"<h3>5. Transformadores em paralelo</h3>"+
P("Dividem a carga na proporção inversa das impedâncias em ohms (no mesmo lado). Para dividir igualmente, as impedâncias em ohms devem ser iguais; com mesmas potência e tensão nominais, isso significa a mesma impedância percentual."),
exemplo:{
 titulo:"Exemplo: mudança de base e corrente de base",
 enun:P("Um gerador de 30 MVA, 13,8 kV tem reatância de 15% na base própria. O estudo usa S<sub>base</sub> = 100 MVA e V<sub>base</sub> = 13,2 kV no trecho do gerador."),
 passos:[
  {p:"Qual a reatância em pu na nova base? (3 casas)", v:0.548, tol:0.01, r:"X = 0,15·(100/30)·(13,8/13,2)² = 0,15·3,333·1,093 = <b>0,547 pu</b>.", dica:"Multiplique por (S<sub>nova</sub>/S<sub>velha</sub>) e por (V<sub>velha</sub>/V<sub>nova</sub>)². Base de potência maior ⇒ pu maior."},
  {p:"Qual a impedância de base desse trecho (em Ω)?", v:1.742, tol:0.01, r:"Z<sub>base</sub> = 13,2²/100 = <b>1,742 Ω</b>.", dica:"Z<sub>base</sub> = kV²/MVA."},
  {p:"Quanto vale essa reatância em ohms?", v:0.953, tol:0.02, r:"X = 0,547·1,742 = <b>0,953 Ω</b>. Confira pela base própria: 0,15·13,8²/30 = 0,952 Ω. As duas contas batem.", dica:"X<sub>Ω</sub> = X<sub>pu</sub> · Z<sub>base</sub>. Você pode conferir pela base própria do gerador."},
  {p:"Qual a corrente de base nesse trecho (em A)?", v:4374, tol:0.01, r:"I<sub>base</sub> = 100·10⁶/(√3·13,2·10³) = <b>4374 A</b>.", dica:"I<sub>base</sub> = S/(√3·V)."}
 ],
 fecho:"Repare no passo 3: converter para ohms nas duas bases e comparar é a melhor forma de conferir a mudança de base."
}
});

B({
id:"b05", titulo:"Transformadores",
sub:"Ensaios, rendimento, autotransformador, paralelo, três enrolamentos e ligações trifásicas.",
objetivos:["Tirar R<sub>eq</sub> e X<sub>eq</sub> do ensaio de curto-circuito e calcular rendimento","Calcular a potência de um autotransformador a partir do trafo de dois enrolamentos (e vice-versa)","Dividir a carga entre trafos em paralelo","Separar as impedâncias de um trafo de três enrolamentos","Relacionar espiras com tensões de fase em ligações Y/Δ"],
qs:["23-23","08-27","23-24","11-45","11-48","11-46"],
aula:
"<h3>1. Ensaios</h3>"+
"<ul><li><b>Curto-circuito</b> (secundário em curto, tensão reduzida, corrente nominal): mede as perdas no cobre e a impedância série. R<sub>eq</sub> = P<sub>cc</sub>/I²; |Z<sub>eq</sub>| = V<sub>cc</sub>/I; X<sub>eq</sub> = √(Z² − R²).</li><li><b>Vazio</b> (secundário aberto, tensão nominal): mede as perdas no núcleo e a corrente de magnetização.</li></ul>"+
F("η = P<sub>saída</sub>/(P<sub>saída</sub> + perdas no cobre + perdas no núcleo)<br>Com corrente I: perdas no cobre = I²·R<sub>eq</sub>")+
TRAP("a carga pode ter reatância capacitiva que cancela a reatância do trafo. Monte a impedância total em série antes de achar a corrente.")+
"<h3>2. Autotransformador</h3>"+
P("Um trafo de dois enrolamentos (V<sub>1</sub>, V<sub>2</sub>, S) religado como auto: um enrolamento fica comum e o outro em série. A potência que passa pelo auto é maior porque parte dela vai por condução.")+
F("S<sub>auto</sub> = S<sub>enrolamento</sub> · (V<sub>maior</sub>/V<sub>série</sub>)<br>V<sub>série</sub> = V<sub>maior</sub> − V<sub>menor</sub> (tensão do enrolamento em série)")+
P("Ligação aditiva de um trafo 120/24 V: tensões 120 e 144 V; o enrolamento em série é o de 24 V. Cada enrolamento continua limitado à sua corrente nominal.")+
"<h3>3. Transformadores em paralelo</h3>"+
F("S<sub>i</sub> ∝ S<sub>n,i</sub>/Z<sub>%,i</sub> &nbsp;&nbsp; ⇒ &nbsp; S<sub>i</sub> = S<sub>total</sub> · (S<sub>n,i</sub>/Z<sub>i</sub>) / Σ(S<sub>n,k</sub>/Z<sub>k</sub>)")+
P("O trafo de menor impedância percentual \"puxa\" mais carga em proporção à sua potência. Se as Z% forem iguais, a carga se divide na proporção das potências nominais.")+
"<h3>4. Três enrolamentos</h3>"+
F("Z<sub>12</sub> = Z<sub>1</sub> + Z<sub>2</sub>, &nbsp; Z<sub>13</sub> = Z<sub>1</sub> + Z<sub>3</sub>, &nbsp; Z<sub>23</sub> = Z<sub>2</sub> + Z<sub>3</sub><br>Z<sub>1</sub> = (Z<sub>12</sub> + Z<sub>13</sub> − Z<sub>23</sub>)/2 &nbsp;(e análogos)")+
"<h3>5. Ligações trifásicas</h3>"+
P("Cada enrolamento fica sobre uma fase do núcleo e enxerga a TENSÃO DE FASE da ligação: no Y, V<sub>L</sub>/√3; no Δ, V<sub>L</sub>. A relação de espiras é a relação entre essas tensões de enrolamento. Ex.: Y–Δ: N<sub>1</sub>/N<sub>2</sub> = (V<sub>L1</sub>/√3)/V<sub>L2</sub>."),
exemplo:{
 titulo:"Exemplo: ensaio de curto e rendimento",
 enun:P("Um trafo monofásico 1:1 teve, no ensaio de curto-circuito, P = 500 W, V = 40 V e I = 25 A. Perdas no núcleo e magnetização desprezíveis. Ele alimenta, a partir de uma fonte de 200 V, uma carga de 7 Ω resistiva pura."),
 passos:[
  {p:"Qual a resistência equivalente R<sub>eq</sub> (em Ω)?", v:0.8, r:"R<sub>eq</sub> = 500/25² = <b>0,8 Ω</b>.", dica:"Toda a potência do ensaio de curto é perda no cobre: P = I²R."},
  {p:"Qual a reatância equivalente X<sub>eq</sub> (em Ω)?", v:1.386, tol:0.02, r:"|Z| = 40/25 = 1,6 Ω ⇒ X = √(1,6² − 0,8²) = <b>1,386 Ω</b>.", dica:"|Z| = V<sub>cc</sub>/I<sub>cc</sub>; depois X = √(Z² − R²)."},
  {p:"Qual a corrente com a carga de 7 Ω (em A)?", v:25.25, tol:0.02, r:"Z<sub>total</sub> = (0,8 + 7) + j1,386 ⇒ |Z| = √(7,8² + 1,386²) = 7,92 Ω ⇒ I = 200/7,92 = <b>25,2 A</b>.", dica:"Some a impedância do trafo com a carga (em série) e use o módulo."},
  {p:"Qual o rendimento (em %)?", v:89.7, tol:0.01, r:"η = R<sub>carga</sub>/(R<sub>carga</sub> + R<sub>eq</sub>) = 7/7,8 = <b>89,7%</b> (a corrente é a mesma nas duas resistências).", dica:"Com a mesma corrente, η = I²R<sub>carga</sub>/(I²R<sub>carga</sub> + I²R<sub>eq</sub>)."}
 ],
 fecho:"Na 23-23 a carga tem uma reatância capacitiva que cancela exatamente a do trafo. Fica ainda mais simples."
}
});

Q("23-23",{
enun:P("Um transformador monofásico de relação unitária foi submetido ao ensaio de curto-circuito: potência ativa 800 W, tensão 50 V e corrente 20 A. Despreze a corrente de magnetização e as perdas no núcleo. Quando alimentado por uma fonte de 400 V no primário, com uma carga composta por resistência de 23 Ω em série com reatância capacitiva de 1,5 Ω no secundário, qual será o rendimento, em percentual?"),

B({
id:"b06", titulo:"Motor de indução e métodos de partida",
sub:"Velocidade síncrona, escorregamento, fluxo de potência no rotor, torque e as partidas estrela-triângulo, compensadora, rotor bobinado e inversor.",
objetivos:["Calcular n<sub>s</sub>, escorregamento e velocidade do rotor","Usar o fluxo de potência: P<sub>entreferro</sub>, perdas no rotor e potência mecânica","Calcular torque com a velocidade certa (do eixo)","Comparar correntes e torques nos métodos de partida","Aplicar o efeito da resistência rotórica no torque"],
qs:["06-21","23-27","18-26","06-25","11-26","23-28","23-55","11-42","11-43","11-44"],
aula:
"<h3>1. Velocidade e escorregamento</h3>"+
F("n<sub>s</sub> = 120·f/p &nbsp;(rpm; p = número de POLOS)<br>s = (n<sub>s</sub> − n)/n<sub>s</sub> &nbsp;⇒&nbsp; n = n<sub>s</sub>·(1 − s)<br>Frequência no rotor: f<sub>r</sub> = s·f")+
P("Em 60 Hz: 2 polos → 3600 rpm; 4 → 1800; 6 → 1200; 8 → 900. O motor sempre gira um pouco ABAIXO de n<sub>s</sub>.")+
"<h3>2. Fluxo de potência</h3>"+
F("P<sub>entrada</sub> → (perdas no estator) → P<sub>entreferro</sub> (P<sub>g</sub>)<br>Perdas Joule no rotor = s·P<sub>g</sub> &nbsp;&nbsp; P<sub>mec</sub> = (1 − s)·P<sub>g</sub><br>Torque eletromagnético: T = P<sub>g</sub>/ω<sub>s</sub> = P<sub>mec</sub>/ω<sub>r</sub> &nbsp;&nbsp; ω = 2πn/60")+
P("Se a questão dá P<sub>g</sub> e as perdas Joule do rotor, o escorregamento sai direto: s = P<sub>Joule,rotor</sub>/P<sub>g</sub>.")+
TRAP("calcular o torque dividindo pela velocidade síncrona a potência do EIXO. Potência do eixo se divide pela velocidade do eixo.")+
"<h3>3. Torque e resistência do rotor</h3>"+
P("Na região normal de operação (s pequeno) o torque é aproximadamente proporcional a s/R<sub>2</sub>. Para manter o mesmo torque com mais resistência no rotor (rotor bobinado), o escorregamento cresce na mesma proporção:")+
F("R<sub>2</sub>/s<sub>1</sub> = (R<sub>2</sub> + R<sub>ext</sub>)/s<sub>2</sub>")+
P("Aumentar R<sub>2</sub> desloca o torque máximo para escorregamentos maiores sem mudar o seu valor: por isso a partida de rotor bobinado começa com a MAIOR resistência (mais torque de partida, menos corrente).")+
"<h3>4. Métodos de partida</h3>"+
"<ul><li><b>Direta:</b> corrente de partida 5 a 8 vezes a nominal.</li><li><b>Estrela-triângulo:</b> o motor (projetado para Δ) parte em Y. Tensão no enrolamento cai √3 vezes; corrente de LINHA e torque caem para <b>1/3</b>. Ao contrário: em Δ a corrente de linha é 3 vezes a de Y.</li><li><b>Chave compensadora</b> (autotrafo com tap k): corrente da linha e torque caem para k².</li><li><b>Soft-starter:</b> rampa de tensão por tiristores.</li><li><b>Inversor de frequência:</b> controla V/f constante; parte com corrente baixa e torque alto (melhor que a direta).</li><li><b>Motor CC:</b> resistência em série na armadura; o campo deve estar plenamente excitado.</li><li><b>Síncrono:</b> parte como indução (enrolamento amortecedor) ou com motor auxiliar; só depois se aplica a excitação CC.</li></ul>"+
"<h3>5. Na instalação (NBR 5410)</h3>"+
"<ul><li>Queda de tensão na partida: até 10% nos terminais do dispositivo de partida.</li><li>Resistência de aquecimento: evita condensação de umidade com o motor parado.</li><li>Corrente de projeto: P<sub>eixo</sub>/(η·√3·V·FP).</li></ul>",
exemplo:{
 titulo:"Exemplo: do entreferro ao eixo",
 enun:P("Motor de indução trifásico, 6 polos, 60 Hz. A potência transferida ao rotor pelo entreferro é 20 kW e as perdas Joule no rotor são 0,6 kW. Despreze atrito e ventilação."),
 passos:[
  {p:"Qual a velocidade síncrona (em rpm)?", v:1200, r:"n<sub>s</sub> = 120·60/6 = <b>1200 rpm</b>.", dica:"n<sub>s</sub> = 120f/p, com p = número de polos."},
  {p:"Qual o escorregamento (em %)?", v:3, r:"s = 0,6/20 = 0,03 = <b>3%</b>.", dica:"Perdas Joule no rotor = s·P<sub>g</sub>."},
  {p:"Qual a velocidade do eixo (em rpm)?", v:1164, r:"n = 1200·(1 − 0,03) = <b>1164 rpm</b>.", dica:"n = n<sub>s</sub>(1 − s)."},
  {p:"Qual o torque no eixo (em N·m)?", v:159.2, tol:0.01, r:"P<sub>mec</sub> = 20 − 0,6 = 19,4 kW; ω = 2π·1164/60 = 121,9 rad/s ⇒ T = 19 400/121,9 = <b>159,2 N·m</b>. Confira: P<sub>g</sub>/ω<sub>s</sub> = 20 000/125,66 = 159,2 N·m.", dica:"T = P<sub>mec</sub>/ω<sub>r</sub> (ou P<sub>g</sub>/ω<sub>s</sub>, dá o mesmo). Converta rpm para rad/s."}
 ],
 fecho:"A 23-27 usa exatamente os passos 2 e 3; a 18-26 usa o passo 4 partindo das perdas totais."
}
});

B({
id:"b07", titulo:"Máquinas CC e máquinas síncronas",
sub:"Equações da máquina CC, tipos de excitação, perda de campo, curvas de gerador, excitação do motor síncrono e frequência de máquinas acopladas.",
objetivos:["Usar V = E + R<sub>a</sub>I<sub>a</sub> e E = kφω para achar R<sub>a</sub>, velocidade ou corrente","Distinguir excitação série, derivação (shunt), composta e independente","Prever o que acontece quando o campo de um motor shunt abre","Saber o efeito da corrente de campo no reativo do motor síncrono","Relacionar polos, velocidade e frequência de máquinas síncronas acopladas"],
qs:["23-25","18-57","11-41","18-22","18-25","18-23","23-26"],
aula:
"<h3>1. Equações da máquina CC</h3>"+
F("Motor: V = E + R<sub>a</sub>·I<sub>a</sub> &nbsp;&nbsp; Gerador: V = E − R<sub>a</sub>·I<sub>a</sub><br>E = k·φ·ω (f.c.e.m.) &nbsp;&nbsp; T = k·φ·I<sub>a</sub><br>Fluxo constante ⇒ E ∝ n &nbsp;⇒&nbsp; E<sub>2</sub>/E<sub>1</sub> = n<sub>2</sub>/n<sub>1</sub>")+
P("Em vazio o motor ainda puxa uma pequena corrente (perdas rotacionais). Com campo em derivação, a corrente da fonte é I<sub>a</sub> + I<sub>campo</sub>.")+
TRAP("duas medições só determinam R<sub>a</sub> se forem independentes. Se uma for múltiplo da outra (V, I e n todos escalados pelo mesmo fator), o sistema é indeterminado.")+
"<h3>2. Tipos de excitação</h3>"+
"<ul><li><b>Derivação (shunt):</b> campo em paralelo com a armadura, muitas espiras finas, corrente pequena (1 a 5% da nominal), mas recebe a tensão TOTAL da armadura. Velocidade quase constante.</li><li><b>Série:</b> campo em série, poucas espiras grossas, conduz a corrente de carga toda, com queda de tensão pequena. Torque de partida alto; dispara em vazio.</li><li><b>Composta:</b> série + derivação (aditiva ou subtrativa; longa ou curta).</li><li><b>Independente:</b> fonte separada para o campo.</li></ul>"+
"<h3>3. Perda de campo no motor shunt</h3>"+
P("φ cai ao valor residual ⇒ E cai ⇒ I<sub>a</sub> = (V − E)/R<sub>a</sub> sobe muito ⇒ o motor tende a disparar (a velocidade sobe para tentar restabelecer E = kφω). Por isso existe relé de perda de campo.")+
"<h3>4. Característica do gerador CC (V × I de carga)</h3>"+
"<ul><li>Independente e shunt: tensão CAI com a carga (shunt cai mais).</li><li>Série: tensão SOBE com a carga (o fluxo cresce com a corrente) até a saturação; depois cai por reação de armadura e queda resistiva. É a curva que sobe e depois desce.</li><li>Composto aditivo: tensão quase plana ou crescente; subtrativo: cai rapidamente.</li></ul>"+
"<h3>5. Máquina síncrona</h3>"+
F("n<sub>s</sub> = 120·f/p &nbsp;&nbsp; duas máquinas no mesmo eixo: f<sub>1</sub>/p<sub>1</sub> = f<sub>2</sub>/p<sub>2</sub>")+
"<ul><li><b>Motor síncrono, potência constante:</b> aumentar a corrente de campo aumenta E. Subexcitado ⇒ absorve reativo (FP indutivo). Sobre-excitado ⇒ fornece reativo (FP capacitivo, \"compensador síncrono\").</li><li>Velocidade não muda com a excitação nem com a carga (enquanto em sincronismo).</li><li>Torque com potência constante e velocidade constante também não muda.</li></ul>",
exemplo:{
 titulo:"Exemplo: resistência de armadura por dois pontos de operação",
 enun:P("Um motor CC com fluxo constante (ímã permanente) é alimentado com 120 V. Em vazio consome 2 A e gira a 2000 rpm. Com carga consome 20 A e gira a 1940 rpm."),
 passos:[
  {p:"Qual a razão E<sub>carga</sub>/E<sub>vazio</sub>? (2 casas)", v:0.97, r:"E ∝ n ⇒ 1940/2000 = <b>0,97</b>.", dica:"Fluxo constante: E = kω, então a razão das f.c.e.m. é a razão das velocidades."},
  {p:"Escreva E nos dois casos e ache R<sub>a</sub> (em Ω).", v:0.1993, tol:0.02, r:"120 − 20R<sub>a</sub> = 0,97·(120 − 2R<sub>a</sub>) ⇒ 120 − 20R<sub>a</sub> = 116,4 − 1,94R<sub>a</sub> ⇒ 3,6 = 18,06R<sub>a</sub> ⇒ <b>R<sub>a</sub> ≈ 0,199 Ω</b>.", dica:"E = V − R<sub>a</sub>I<sub>a</sub> em cada ponto. Iguale E<sub>carga</sub> = 0,97·E<sub>vazio</sub>."},
  {p:"Qual a constante k em V/(rpm), em milésimos? (E<sub>vazio</sub>/2000 × 1000)", v:59.8, tol:0.02, r:"E<sub>vazio</sub> = 120 − 2·0,199 = 119,6 V ⇒ k = 119,6/2000 = <b>0,0598 V/rpm</b>.", dica:"k = E/n com os dados de vazio."}
 ],
 fecho:"Na 18-57 tente o mesmo procedimento e veja o que acontece com as equações. Na 23-25 há também a corrente de campo em derivação."
}
});

Q("23-25",{
enun:P("Um motor CC, com campo em paralelo com a armadura, é alimentado por 200 V nominais e possui enrolamento de compensação e interpolos, de forma que seu fluxo pode ser considerado constante, independentemente da carga. Em vazio (torque zero) consome corrente total de 10 A e gira a 1800 rpm. Considere que a resistência de armadura inclui as resistências do enrolamento de armadura, escovas, compensação e interpolos. Quando o motor opera a 1728 rpm, com corrente total de 170 A, qual é o valor da resistência de armadura, em miliohms?"),

dicas:["Fluxo constante: E<sub>carga</sub>/E<sub>vazio</sub> = 1728/1800 = 0,96.","200 − 170R<sub>a</sub> = 0,96·(200 − 10R<sub>a</sub>). A corrente de campo é a mesma nos dois casos e quase não altera o resultado."],

res:OL(["E ∝ n: E<sub>c</sub> = 0,96·E<sub>v</sub>.","Desprezando a pequena corrente de campo: 200 − 170R<sub>a</sub> = 0,96(200 − 10R<sub>a</sub>) = 192 − 9,6R<sub>a</sub>.","8 = 160,4R<sub>a</sub> ⇒ R<sub>a</sub> ≈ 0,0499 Ω = <b>50 mΩ</b>.","Com a corrente de campo I<sub>f</sub> descontada dos dois lados o resultado muda muito pouco (continua ≈ 50 mΩ)."])

Q("18-57",{
enun:P("Para caracterizar um motor CC de ímã permanente, foram realizados dois ensaios em vazio. No primeiro, aplicou-se 60 V e o motor apresentou corrente de armadura de 1,5 A e velocidade de 12.000 rpm. No segundo, aplicou-se 80 V, e o motor exibiu corrente de armadura de 2,0 A e atingiu 16.000 rpm. Com base nessas medições, conclui-se que a resistência elétrica do enrolamento de armadura, em ohms, é igual a"),

dicas:["Escreva V = R·I + k·n para cada ensaio.","Compare as duas equações. Uma é múltipla da outra?"],

C:"Substitua R = 1,2 nas duas equações: ambas são satisfeitas com o mesmo k. Isso vale para quase qualquer R. Por quê?",

E:"Com R = 2,0, k = (60 − 3)/12 000, e a 2ª equação também fecha. A conclusão não pode ser um valor único."},
res:OL(["Ensaio 1: 60 = 1,5R + 12 000k. Ensaio 2: 80 = 2,0R + 16 000k.","A equação 2 é exatamente a equação 1 multiplicada por 4/3 (60→80, 1,5→2, 12 000→16 000).","São a mesma equação: infinitas soluções (R, k). <b>Não é possível determinar R<sub>a</sub></b>.","Para medir R<sub>a</sub> seria preciso um ensaio com rotor bloqueado (n = 0 ⇒ R = V/I) ou pontos não proporcionais."])

B({
id:"b08", titulo:"Linhas de transmissão e fluxo de potência",
sub:"Parâmetros da linha, efeito pelicular, transposição, quadripolo ABCD, impedâncias de sequência e potência transmitida entre duas barras.",
objetivos:["Explicar efeito pelicular, corona, Ferranti e transposição","Usar as constantes ABCD (incluindo a linha em vazio)","Calcular impedâncias de sequência a partir das impedâncias própria e mútua","Escrever P e Q transmitidos entre duas barras e as perdas reativas na linha"],
qs:["23-21","18-24","11-24","11-31","08-32"],
aula:
"<h3>1. Parâmetros e fenômenos</h3>"+
"<ul><li><b>Efeito pelicular (skin):</b> em CA a corrente se concentra na periferia do condutor; a densidade no centro cai. Quanto maior a frequência, maior a resistência aparente (efetiva).</li><li><b>Corona:</b> ionização do ar em volta do condutor (campo elétrico alto). Reduz-se com condutores de maior diâmetro ou feixes.</li><li><b>Efeito Ferranti:</b> em linha longa com carga leve, a tensão no receptor fica MAIOR que no emissor (capacitância shunt).</li><li><b>Transposição:</b> troca a posição das fases ao longo da linha para igualar as indutâncias e capacitâncias das três fases, reduzindo o desequilíbrio das tensões induzidas.</li></ul>"+
"<h3>2. Quadripolo ABCD</h3>"+
F("V<sub>S</sub> = A·V<sub>R</sub> + B·I<sub>R</sub> &nbsp;&nbsp; I<sub>S</sub> = C·V<sub>R</sub> + D·I<sub>R</sub><br>Linha em vazio (I<sub>R</sub> = 0): V<sub>R</sub> = V<sub>S</sub>/A")+
P("Como |A| &lt; 1 em linhas longas, a tensão em vazio no receptor sobe: é o Ferranti em forma de conta.")+
"<h3>3. Impedâncias de sequência de uma linha transposta</h3>"+

Q("18-30",{

ops:[M("1 α α²;1 α² α;1 1 1"),M("1 1 1;1 α² α;1 α α²"),M("1 1 1;1 α α²;1 α² α"),M("1 1 1;1 α² α²;1 α α"),M("1 1 1;1 α α;1 α² α²")], gab:"C",
dicas:["I<sub>0</sub> = (I<sub>A</sub> + I<sub>B</sub> + I<sub>C</sub>)/3 ⇒ 1ª linha [1 1 1].","Para extrair a positiva, multiplica-se B por α para \"desfazer\" o atraso de 120°: I<sub>1</sub> = (I<sub>A</sub> + αI<sub>B</sub> + α²I<sub>C</sub>)/3."],
erros:{
A:"A 1ª linha deve dar I<sub>0</sub> = soma/3, ou seja, [1 1 1].",
B:"As linhas 2 e 3 estão trocadas: essa matriz daria I<sub>2</sub> na 2ª posição. Para a positiva, B é multiplicada por α (e não α²).",
D:"Cada linha da inversa tem α e α² (os dois), nunca o mesmo operador repetido. Lembre: 1 + α + α² = 0 precisa aparecer.",
E:"Linhas com o mesmo operador em B e C não separam as sequências. A 2ª linha é [1 α α²]."},
res:P("M = "+M("1 1 1;1 α α²;1 α² α")+". I<sub>0</sub> = (I<sub>A</sub>+I<sub>B</sub>+I<sub>C</sub>)/3, I<sub>1</sub> = (I<sub>A</sub>+αI<sub>B</sub>+α²I<sub>C</sub>)/3, I<sub>2</sub> = (I<sub>A</sub>+α²I<sub>B</sub>+αI<sub>C</sub>)/3. Alternativa C.")
});

B({
id:"b10", titulo:"Proteção: dispositivos, curvas e coordenação",
sub:"Disjuntor, DR, fusível, seccionador, relés de sobrecorrente e de falha de disjuntor (50BF), TCs e leitura de curvas tempo × corrente.",
objetivos:["Saber o que cada dispositivo protege (sobrecarga, curto, fuga)","Aplicar I<sub>B</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub> da NBR 5410","Escolher fusível de motor pela curva (corrente e tempo de partida)","Converter corrente primária em múltiplo do ajuste do relé e ler o tempo na curva","Ajustar relé térmico de motor e relé de sobrecorrente de transformador"],
qs:["11-39","11-36","23-30","18-21","18-28","18-32","18-49","23-54","23-29","23-32","18-47"],
aula:
"<h3>1. Quem protege contra o quê</h3>"+
"<ul><li><b>Disjuntor termomagnético:</b> parte térmica (bimetal) contra SOBRECARGA; parte magnética contra CURTO-CIRCUITO. Rearmável.</li><li><b>DR (diferencial residual):</b> compara a soma das correntes dos condutores vivos; atua com corrente de FUGA à terra (proteção contra choque e incêndio). Não protege contra sobrecarga.</li><li><b>Fusível:</b> elo que funde (não é bimetálico); atua em sobrecarga e curto conforme a classe (gG/gL geral, aM motor).</li><li><b>Seccionador:</b> manobra SEM carga (só correntes desprezíveis); garante isolamento visível. Seccionador de aterramento: após abrir, aterra os circuitos para a manutenção.</li><li><b>Relé 50/51:</b> sobrecorrente instantânea (50) e temporizada (51). <b>50BF:</b> falha de disjuntor: se o disjuntor não abriu, manda abrir os disjuntores ADJACENTES.</li></ul>"+
TRAP("nunca se coloca dispositivo de seccionamento ou proteção no condutor de proteção (PE).")+
"<h3>2. Coordenação condutor × proteção (NBR 5410)</h3>"+
F("I<sub>B</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub> &nbsp;&nbsp; e &nbsp;&nbsp; I<sub>2</sub> ≤ 1,45·I<sub>z</sub><br>I<sub>B</sub> = corrente de projeto; I<sub>n</sub> = corrente nominal do dispositivo; I<sub>z</sub> = capacidade de condução do cabo")+
"<h3>3. Lendo curvas tempo × corrente</h3>"+
OL(["Converta tudo para o eixo do gráfico (ampères, ou múltiplos de I<sub>n</sub> ou do ajuste).","Escalas logarítmicas: entre 1 e 10 as divisões não são iguais (2 fica a 30% da década, 5 a 70%).","<b>Fusível de motor:</b> marque o ponto (I<sub>partida</sub>, t<sub>partida</sub>). O fusível adequado é o MENOR cuja curva passa à direita/acima desse ponto (não funde na partida).","<b>Disjuntor e choque:</b> a corrente de falta tem de ficar numa região em que o tempo MÁXIMO de atuação (borda superior da faixa) seja menor que o tempo permitido.","<b>Relé com TC:</b> I<sub>sec</sub> = I<sub>prim</sub>/RTC; múltiplo = I<sub>sec</sub>/I<sub>ajuste</sub>; leia o tempo na curva."])+
"<h3>4. Ajustes típicos</h3>"+
"<ul><li><b>Relé térmico de motor:</b> até 125% da corrente nominal (motor com fator de serviço ≥ 1,15 ou elevação de temperatura ≤ 40 °C); 115% nos demais.</li><li><b>Relé de transformador:</b> I<sub>n</sub> do lado em que está o TC × fator de sobrecarga admissível, depois dividido pela RTC.</li></ul>",
exemplo:{
 titulo:"Exemplo: tempo de atuação de um relé 51",
 enun:P("Um relé de sobrecorrente temporizado é alimentado por um TC 200-5 A. A corrente de ajuste (pick-up) secundária é 4 A. Ocorre uma falta de 1200 A no primário. A curva do relé dá t = 0,14·0,2/(M<sup>0,02</sup> − 1) segundos (curva normal inversa IEC, dial 0,2), com M = múltiplo do ajuste."),
 passos:[

B({
id:"b11", titulo:"Instalações BT, esquemas de aterramento e malhas de terra",
sub:"Queda de tensão, dimensionamento por momento elétrico, DPS, esquemas TN/TT/IT, proteção contra contatos indiretos, método de Wenner e tensões de toque e passo.",
objetivos:["Calcular queda de tensão unitária e por momento (MVA·km, W·m)","Tratar carga uniformemente distribuída como concentrada no meio","Identificar TN-S, TN-C, TT e IT pelas ligações da alimentação e das massas","Saber como resolver falta de proteção contra contatos indiretos","Estratificar o solo pela curva de Wenner e checar toque e passo"],
qs:["18-29","18-46","23-59","11-25","23-22","08-30","23-31","06-28","11-37","11-35","23-57","18-48"],
aula:
"<h3>1. Queda de tensão</h3>"+
F("Monofásico (2 condutores): ΔV = 2·R'·L·I &nbsp;&nbsp; Trifásico equilibrado: ΔV<sub>linha</sub> = √3·R'·L·I<br>Queda unitária: ΔV<sub>u</sub> = ΔV/(I·L) em V/(A·km)<br>Coeficiente de queda: k = ΔV%/(S·L) em %/(MVA·km)")+
P("<b>Carga uniformemente distribuída</b> ao longo de L equivale à carga total concentrada em L/2.")+
P("<b>Tabelas de momento (W × m) para circuitos monofásicos a 127 V:</b> num circuito trifásico equilibrado a 4 fios (220/127 V), cada fase carrega 1/3 da potência e a corrente não volta pelo neutro. A queda por fase acontece num só condutor (no monofásico são dois), então, para a mesma queda percentual, o momento admissível por fase dobra. Momento equivalente a procurar na tabela monofásica = (P/3 × L)/2.")+
"<h3>2. Esquemas de aterramento (NBR 5410)</h3>"+
"<ul><li><b>1ª letra (alimentação):</b> T = um ponto diretamente aterrado; I = isolado ou aterrado por impedância.</li><li><b>2ª letra (massas):</b> T = massas em eletrodo próprio, distinto do da alimentação; N = massas ligadas ao ponto aterrado da alimentação (pelo condutor de proteção).</li><li><b>TN-S:</b> PE e N separados. <b>TN-C:</b> PEN único. <b>TN-C-S:</b> combina.</li></ul>"+
P("Na subestação, se o neutro e todas as massas vão à MESMA malha, o esquema é TN. No TN-C, se o PEN rompe, a carcaça fica ligada à fase pela carga: tensão fase-neutro na carcaça.")+
"<h3>3. Contatos indiretos (seccionamento automático)</h3>"+
P("No TN, a falta fase-massa vira um curto pelo PE; o dispositivo deve atuar no tempo exigido. Se não atua: diminuir a impedância do laço (aumentar a seção, reduzir o comprimento), usar dispositivo mais rápido ou um DR. Reduzir a potência da carga não altera a corrente de falta.")+
"<h3>4. DPS</h3>"+
P("Fica em derivação (paralelo): um lado no condutor de fase (ou neutro), o outro no barramento de equipotencialização principal ou na barra PE do quadro. Nunca em série.")+
"<h3>5. Aterramento e resistividade do solo</h3>"+
"<ul><li><b>Método de Wenner:</b> 4 eletrodos espaçados de a; ρ(a) = 2πaR. Espaçamentos maiores \"enxergam\" camadas mais profundas.</li><li><b>Duas camadas:</b> ρ<sub>1</sub> = valor para a pequeno (assíntota inicial); ρ<sub>2</sub> = valor para a grande (assíntota final). Coeficiente de reflexão K = (ρ<sub>2</sub> − ρ<sub>1</sub>)/(ρ<sub>2</sub> + ρ<sub>1</sub>).</li><li><b>Número de camadas:</b> cada mudança de tendência ou patamar da curva indica uma nova camada.</li><li><b>Critérios de malha:</b> potencial de toque e de passo calculados (na malha, na cerca e na periferia) devem ficar abaixo dos admissíveis.</li><li>NBR 5410: armaduras do concreto das fundações são o eletrodo de aterramento preferencial; mastros e antenas devem ser ligados (equipotencializados) ao aterramento; o mesmo eletrodo serve à instalação e ao SPDA.</li></ul>",

B({
id:"b12", titulo:"Comandos elétricos e CLP (ladder)",
sub:"Contatos NA/NF, selo, intertravamento, temporizadores com retardo na ligação e no desligamento, e a tradução de ladder para lógica booleana.",
objetivos:["Ler um diagrama de comando: quem energiza cada bobina e o que a mantém","Reconhecer selo (retenção) e intertravamento","Simular temporizadores (retardo na energização × no desligamento) numa linha do tempo","Escrever a expressão booleana de uma linha ladder e simular um processo no tempo"],
qs:["08-31","18-55","06-26","08-28"],
aula:
"<h3>1. Símbolos e ideia básica</h3>"+
"<ul><li><b>Contato NA (normalmente aberto):</b> fecha quando a bobina do seu contator/relé é energizada. <b>NF (normalmente fechado):</b> abre quando a bobina é energizada.</li><li><b>Botoeira sem retenção:</b> só muda de estado enquanto é pressionada.</li><li><b>Selo:</b> contato NA do próprio contator em paralelo com a botoeira de liga. Depois de soltar a botoeira, a bobina continua energizada pelo selo.</li><li><b>Intertravamento:</b> contato NF de um contator em série com a bobina do outro. Impede que os dois operem juntos.</li><li><b>Botoeira de desliga (NF)</b> em série no início do circuito: abre tudo, inclusive os selos.</li></ul>"+
TRAP("ao julgar \"apertar S1 desliga C2\", veja ONDE o selo de C2 se liga. Se ele contorna as botoeiras, abrir um contato de botoeira não derruba C2.")+
"<h3>2. Temporizadores</h3>"+
"<ul><li><b>Retardo na energização (on-delay):</b> os contatos mudam T segundos DEPOIS de a bobina ser energizada; voltam imediatamente ao desenergizar.</li><li><b>Retardo no desligamento (off-delay):</b> os contatos mudam IMEDIATAMENTE ao energizar e só voltam T segundos depois de a bobina ser desenergizada.</li></ul>"+
P("Para circuitos com temporizadores, monte uma linha do tempo: anote cada evento (t = 0, 15 min, 40 min...) e o estado de cada bobina e contato depois dele. Ciclos aparecem quando um evento leva o circuito de volta ao estado inicial.")+
"<h3>3. Ladder → booleana</h3>"+
F("Contatos em série = E (·) &nbsp;&nbsp; em paralelo = OU (+) &nbsp;&nbsp; contato NF = NÃO (barra)<br>Selo clássico: B = (X<sub>liga</sub> + B)·X̄<sub>desliga</sub>")+
P("Para simular um CLP no tempo, avalie a linha a cada mudança das entradas. Uma saída selada continua ligada depois que a entrada de partida volta a 0, até a condição de desligamento abrir a linha."),
exemplo:{
 titulo:"Exemplo: partida com selo e desligamento",
 enun:P("Linha ladder: [X<sub>1</sub> (NA) em paralelo com B (NA)] em série com X<sub>2</sub> (NF) → bobina B. Um processo enche um tanque a 20 L/min quando B = 1. X<sub>1</sub> = 1 de t = 2 a 3 min e de t = 6 a 7 min. X<sub>2</sub> = 1 de t = 4 a 5 min (e 0 no resto)."),
 passos:[
  {p:"Em que instante B liga pela primeira vez (min)?", v:2, r:"Em <b>t = 2 min</b>: X<sub>1</sub> fecha e X<sub>2</sub> (NF) está fechado.", dica:"B liga quando a linha tem continuidade: X<sub>1</sub> ou B, E X<sub>2</sub> não acionado."},
  {p:"Em que instante B desliga (min)?", v:4, r:"Em <b>t = 4 min</b>: X<sub>2</sub> = 1 abre o contato NF e derruba o selo. Entre 3 e 4 min, B ficou ligado só pelo selo.", dica:"O selo mantém B até que o contato NF de X<sub>2</sub> abra."},
  {p:"Em t = 5 min, X<sub>2</sub> volta a 0. B religa sozinho? Responda 1 (sim) ou 0 (não).", v:0, tol:0, r:"<b>Não (0)</b>: o selo já caiu e X<sub>1</sub> = 0. Só religa em t = 6 min com novo pulso de X<sub>1</sub>.", dica:"Para religar, a linha precisa de X<sub>1</sub> = 1 ou do selo, que já está aberto."},
  {p:"Volume total bombeado até t = 10 min (L)?", v:120, r:"Ligado de 2 a 4 (2 min) e de 6 a 10 (4 min, porque nada o desliga depois) = 6 min × 20 = <b>120 L</b>.", dica:"Some os intervalos com B = 1 e multiplique pela vazão."}
 ],
 fecho:"A 18-55 é quase este exemplo, mas com X<sub>2</sub> permanecendo em 1 depois de t = 5 min. Veja como isso muda o segundo pulso."
}
});

Q("06-26",{
tipo:"vf",
enun:P("A figura apresenta o circuito de comando de três máquinas trifásicas acionadas pelos contatores C1, C2 e C3. As chaves S1, S2 e S3 são do tipo sem retenção (S é a botoeira de desliga, NF; RT é o contato do relé térmico). Julgue as afirmativas."),
fig:"f06_26",
aviso:"pela análise do circuito, as afirmativas I a IV são verdadeiras e a V é falsa, combinação que não existe entre as alternativas originais [(A) I e II; (B) II, III e V; (C) I, III e V; (D) II, III, IV e V; (E) I, II, III, IV e V]. A banca provavelmente considerou (E). Por isso, aqui a questão é cobrada como julgamento de cada afirmativa.",
itens:[
 {t:"I – As lâmpadas LA e LB podem acender simultaneamente, sendo que nessa condição as máquinas comandadas por C2 e C3 deverão estar desligadas.", v:true, erro:"Olhe os contatos em série com as lâmpadas: LA tem um NF de C2; LB tem NF de C2 e NF de C3. Com C2 e C3 desligados, os dois acendem juntos."},
 {t:"II – A lâmpada LC somente acende quando a máquina comandada pelo contator C1 entra em operação.", v:true, erro:"O contato em série com LC é um NA de C1: só fecha com C1 energizado."},
 {t:"III – As máquinas não podem funcionar simultaneamente.", v:true, erro:"Em série com cada bobina há contatos NF dos OUTROS dois contatores (intertravamento). Basta um ligado para bloquear os outros."},
 {t:"IV – Ao ser acionada a chave S, todas as máquinas são desenergizadas e, após S retornar à sua posição de repouso, as lâmpadas LA e LB acendem.", v:true, erro:"S (NF) alimenta todo o barramento, inclusive os selos: apertá-la derruba tudo. Ao soltar, nenhum contator volta (as botoeiras não estão pressionadas), então os NF de C2 e C3 estão fechados e LA e LB acendem."},
 {t:"V – Ao ser acionada a chave S1, as máquinas comandadas por C2 e C3 são desenergizadas e as lâmpadas LA, LB e LC se acendem.", v:false, erro:"Veja onde se ligam os selos de C2 e C3: eles alimentam o ramo ABAIXO dos contatos de S1, S2 e S3. Abrir o NF de S1 não derruba um contator selado. E C1 nem consegue ligar se C2 ou C3 estiver ligado (intertravamento)."}
],
dicas:["Identifique primeiro: quais contatos são NA (desenhados abertos/inclinados) e quais são NF (desenhados fechados).","Para a afirmativa V, siga o fio do selo de C2: ele volta para qual ponto do ramo de C2?"],
res:OL(["Ramo de C1: S1 (NA) em série com S2 (NF), S3 (NF), C2 (NF), C3 (NF). Selo C1 em paralelo com as botoeiras. Os ramos de C2 e C3 são análogos.","Lâmpadas: LA com NF de C2; LB com NF de C2 e C3; LC com NA de C1.","I, II, III e IV verdadeiras. V falsa, porque os selos contornam as botoeiras e o intertravamento impede C1 de ligar com C2 ou C3 operando."])
});

Q("08-28",{
enun:P("A figura apresenta a parte de controle do acionamento de duas máquinas trifásicas, comandadas pelos contatores C1 e C2. As chaves S0 e S1 são do tipo sem retenção. Os relés K1 e K2 têm retardo na ligação, programados para 15 min e 40 min. O relé K3 tem retardo no desligamento, programado para 20 min. Com o sistema em condições normais, o operador aciona a chave S0 e, após 1 minuto, a chave S1. Sem novas interferências do operador, analise: I – as duas máquinas funcionarão simultaneamente por cerca de 20 minutos a cada hora; II – a máquina de C1 funcionará continuamente por cerca de 45 minutos e permanecerá desligada nos 15 minutos restantes de cada hora; III – a máquina de C2 funcionará por 25 minutos a cada hora; IV – a máquina de C2 funcionará sozinha por mais de 10 minutos a cada hora. Estão corretas APENAS as afirmativas"),
fig:"f08_28", ops:["I e II","II e IV","III e IV","I, II e III","I, III e IV"], gab:"A",
dicas:["S1 energiza R1, que sela pelo próprio contato. K3 (retardo no DESLIGAMENTO) é alimentado pelo NF de K2; seus contatos fecham na hora e ligam as bobinas de K1 e K2.","Monte a linha do tempo a partir de S1 (t = 0): K1 atua em 15 min, K2 em 40 min. Quando K2 atua, o NF de K2 desenergiza K3. O que acontece 20 min depois?"],
erros:{
B:"IV é falsa: C2 só liga em t = 40 min, quando C1 já está ligada desde t = 15; as duas desligam juntas em t = 60. C2 nunca fica sozinha.",
C:"III e IV são falsas. C2 fica ligada de 40 a 60 min: 20 min por hora, sempre junto com C1.",
D:"III é falsa: C2 opera de 40 a 60 min, ou seja, 20 min por ciclo de 60 min, não 25.",
E:"Confira III e IV na linha do tempo: C2 opera 20 min por hora e sempre com C1 ligada."},
res:OL(["t = 0 (S1): R1 sela; NF de K2 fechado ⇒ K3 energiza; seus contatos NA fecham na hora ⇒ K1 e K2 começam a temporizar.","t = 15 min: K1 atua ⇒ C1 liga.","t = 40 min: K2 atua ⇒ C2 liga; o NF de K2 abre ⇒ K3 desenergiza, mas seus contatos só abrem 20 min depois.","t = 60 min: contatos de K3 abrem ⇒ K1 e K2 desenergizam ⇒ C1 e C2 desligam; o NF de K2 fecha ⇒ K3 energiza de novo ⇒ o ciclo de 60 min recomeça.","C1: ligada 45 min (15 → 60) e desligada 15 min ⇒ II verdadeira. C2: 20 min (40 → 60), sempre junto com C1 ⇒ I verdadeira; III e IV falsas. Resposta <b>I e II</b>."])
});

B({
id:"b13", titulo:"Eletrônica analógica e de potência",
sub:"Amplificador operacional, polarização de transistor por Thévenin, regulador linear, conversão A/D, tiristores e conversores CC-CC.",
objetivos:["Usar curto-circuito virtual para achar ganhos e funções de transferência de amp-ops","Reduzir a rede de polarização de um transistor a V<sub>BB</sub> e R<sub>B</sub>","Projetar o divisor de realimentação de um regulador linear","Calcular corrente média em retificadores controlados","Reconhecer o comportamento do buck e da meia-ponte (dois quadrantes)"],
qs:["11-40","18-51","18-52","18-45","18-53","18-56","11-32"],
aula:
"<h3>1. Amp-op ideal</h3>"+
P("Ganho infinito, corrente de entrada nula e, com realimentação negativa, V<sub>+</sub> = V<sub>−</sub> (curto-circuito virtual).")+
F("Inversor: V<sub>o</sub>/V<sub>i</sub> = −Z<sub>f</sub>/Z<sub>i</sub> &nbsp;&nbsp; Não inversor: V<sub>o</sub>/V<sub>i</sub> = 1 + Z<sub>f</sub>/Z<sub>i</sub><br>R e C em série na realimentação: Z<sub>f</sub> = R + 1/(sC) ⇒ |H| = (R/R<sub>i</sub>)·(s + 1/RC)/s (controlador PI)")+
"<h3>2. Polarização por Thévenin</h3>"+
P("Reduza tudo o que está à esquerda da base a uma fonte V<sub>BB</sub> em série com R<sub>B</sub>: transforme fontes de tensão em fontes de corrente (V/R em paralelo com R), some as correntes em paralelo, combine os resistores em paralelo e volte para Thévenin. Resistores em série depois disso somam em R<sub>B</sub>.")+
TRAP("o equivalente de Norton só é igual ao de Thévenin se I<sub>N</sub> = V<sub>th</sub>/R<sub>th</sub>. Confira essa relação nas alternativas.")+
"<h3>3. Regulador linear série</h3>"+
P("O amp-op compara a referência do zener com a fração da saída dada pelo divisor R<sub>1</sub>–R<sub>2</sub> e ajusta o transistor até V<sub>+</sub> = V<sub>−</sub>:")+
F("V<sub>Z</sub> = V<sub>o</sub>·R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>) &nbsp;⇒&nbsp; V<sub>o</sub> = V<sub>Z</sub>·(1 + R<sub>1</sub>/R<sub>2</sub>)")+
"<h3>4. Conversor A/D</h3>"+
F("Resolução (passo) = faixa/2<sup>n</sup> &nbsp;&nbsp; erro máximo de quantização = ± passo/2")+
"<h3>5. Tiristor (SCR)</h3>"+
P("Conduz quando polarizado diretamente E recebe pulso no gate; desliga quando a corrente zera. Com disparo em α e carga resistiva:")+
F("Corrente média no SCR (meia onda controlada): I<sub>méd</sub> = (V<sub>m</sub>/R)·(1 + cos α)/(2π)")+
"<h3>6. Conversores CC-CC</h3>"+
"<ul><li><b>Buck (abaixador):</b> V<sub>o</sub> = D·V<sub>in</sub> (D = ciclo de trabalho &lt; 1, sempre V<sub>o</sub> &lt; V<sub>in</sub>). Se V<sub>in</sub> aumenta, D precisa DIMINUIR. Em regime, a tensão média no indutor é zero, então V<sub>médio, diodo</sub> = V<sub>o</sub>; a corrente média no capacitor é zero.</li><li><b>Meia-ponte com duas chaves e dois diodos (dois quadrantes):</b> tensão no motor só positiva (0 ou V<sub>CC</sub>), corrente nos dois sentidos ⇒ motoriza e regenera (frenagem devolve energia à bateria), mas não inverte o sentido de rotação.</li></ul>",
exemplo:{
 titulo:"Exemplo: amp-op inversor com rede RC",
 enun:P("Amp-op inversor: R<sub>i</sub> = 10 kΩ na entrada; na realimentação, R<sub>f</sub> = 50 kΩ em série com C = 2 µF. Queremos H(s) = V<sub>o</sub>/V<sub>i</sub>."),
 passos:[
  {p:"Qual o ganho em alta frequência (módulo de R<sub>f</sub>/R<sub>i</sub>)?", v:5, r:"Em alta frequência o capacitor é um curto: |H| = 50/10 = <b>5</b>.", dica:"Z<sub>f</sub> = R<sub>f</sub> + 1/(sC). Para s grande, sobra R<sub>f</sub>."},
  {p:"Qual a posição do zero, em rad/s (o valor a em s + a)?", v:10, r:"Z<sub>f</sub> = (sR<sub>f</sub>C + 1)/(sC) ⇒ zero em s = −1/(R<sub>f</sub>C) = −1/(50 000·2·10⁻⁶) = <b>−10 rad/s</b>.", dica:"Coloque Z<sub>f</sub> sobre denominador comum: o zero é 1/(R<sub>f</sub>C)."},
  {p:"Escreva H(s). Qual o coeficiente K em H(s) = −K(s + 10)/s?", v:5, r:"H(s) = −(R<sub>f</sub>/R<sub>i</sub>)(s + 1/R<sub>f</sub>C)/s = <b>−5(s + 10)/s</b>: um controlador PI.", dica:"H = −Z<sub>f</sub>/R<sub>i</sub>. Fatore R<sub>f</sub>."}
 ],
 fecho:"A 11-40 pede o caminho inverso: dado 4(s + 20)/s e R<sub>i</sub> = 5 Ω, ache R e C."
}
});

Q("11-40",{
enun:P("O circuito da figura é composto por um amplificador operacional ideal. Para que a função de transferência desse circuito seja H(s) = V<sub>o</sub>(s)/V<sub>i</sub>(s) = 4(s + 20)/s, os valores de R, em Ω, e de C, em F, devem ser, respectivamente"),
fig:"f11_40", ops:["5 e 0,001","20 e 0,0025","30 e 0,01","15 e 0,1","10 e 0,002"], gab:"B",
dicas:["Inversor: |H| = Z<sub>f</sub>/5 = (R + 1/sC)/5 = (R/5)·(s + 1/RC)/s.","Compare: R/5 = 4 e 1/(RC) = 20."],
erros:{
A:"Com R = 5 Ω o ganho R/5 seria 1, não 4.",
C:"Com R = 30 Ω, R/5 = 6. Confira o fator que multiplica (s + 20).",
D:"R = 15 Ω dá ganho 3, e 1/(RC) = 1/1,5 ≠ 20.",
E:"R = 10 Ω dá ganho 2 e 1/(RC) = 50. Use R/5 = 4 primeiro e depois o zero."},
res:OL(["H(s) = −(R + 1/sC)/5 = −(R/5)·(s + 1/RC)/s (o sinal do inversor é ignorado na comparação).","R/5 = 4 ⇒ R = 20 Ω.","1/(RC) = 20 ⇒ C = 1/(20·20) = 0,0025 F.","Resposta: <b>20 Ω e 0,0025 F</b>."])
});

Q("18-51",{
enun:P("O cálculo da corrente de polarização no transistor Q<sub>1</sub> pode ser simplificado se o circuito for substituído por um equivalente mais simples, que produza o mesmo resultado. O circuito equivalente que produz a mesma corrente de polarização em Q<sub>1</sub> é (veja as alternativas na figura):"),
fig:"f18_51", ops:["I<sub>BB</sub> = 1,0 mA em paralelo com R<sub>B</sub> = 15 kΩ","I<sub>BB</sub> = 1,0 mA em paralelo com R<sub>B</sub> = 25 kΩ","V<sub>BB</sub> = 6,0 V em série com R<sub>B</sub> = 15 kΩ","V<sub>BB</sub> = 10 V em série com R<sub>B</sub> = 10 kΩ","V<sub>BB</sub> = 10 V em série com R<sub>B</sub> = 25 kΩ"], gab:"E",
dicas:["Transforme V<sub>1</sub> = 9 V com R<sub>1</sub> = 15 kΩ em 0,6 mA em paralelo com 15 kΩ. Some com I<sub>1</sub> = 0,4 mA.","1 mA em paralelo com (15 k ∥ 30 k) = 10 kΩ ⇒ Thévenin 10 V com 10 kΩ. Ainda falta o R<sub>3</sub> em série."],
erros:{
A:"O Norton antes do R<sub>3</sub> seria 1 mA com 10 kΩ (e não 15 kΩ). E o R<sub>3</sub> em série ainda não foi incluído.",
B:"1 mA ∥ 25 kΩ equivale a 25 V com 25 kΩ, não a 10 V com 25 kΩ. Depois de somar o R<sub>3</sub> em série, o equivalente de Norton seria 0,4 mA ∥ 25 kΩ.",
C:"6 V sai de um divisor 9·30/45 ignorando a fonte de corrente I<sub>1</sub>. Ela também contribui.",
D:"10 V com 10 kΩ é o equivalente no nó entre R<sub>1</sub> e R<sub>2</sub>. Falta somar R<sub>3</sub> = 15 kΩ em série até a base."},
res:OL(["V<sub>1</sub>/R<sub>1</sub> = 9/15k = 0,6 mA, em paralelo com 15 kΩ.","Somando I<sub>1</sub>: 1,0 mA em paralelo com 15 k ∥ 30 k = 10 kΩ.","Thévenin: 1,0 mA × 10 kΩ = 10 V, em série com 10 kΩ.","Com R<sub>3</sub> em série: <b>V<sub>BB</sub> = 10 V, R<sub>B</sub> = 25 kΩ</b>."])
});

Q("18-52",{
enun:P("A figura mostra um regulador de tensão linear. A partir de uma fonte não regulada V<sub>DC</sub>, o circuito entrega uma tensão regulada à carga, ajustável pelo resistor variável R<sub>1</sub>. O amplificador operacional é ideal e o diodo zener Z<sub>1</sub> tem tensão de ruptura de 5,0 V. Qual deve ser, em kΩ, o valor de R<sub>1</sub> para que o regulador entregue 12 V à carga?"),

dicas:["A entrada + recebe a referência do zener (5 V). A entrada − recebe a tensão no R<sub>2</sub> (divisor da saída).","12·10/(R<sub>1</sub> + 10) = 5."],

A:"Com R<sub>1</sub> = R<sub>2</sub>, a saída seria 2 × 5 = 10 V, não 12 V.",
C:"Com R<sub>1</sub> = 20 kΩ: V<sub>o</sub> = 5·(1 + 20/10) = 15 V.",

});

enun:P("Um sinal de tensão elétrica, variando continuamente no tempo, tem amplitude limitada entre −5 V e +5 V para possibilitar a sua digitalização por um conversor A/D de 8 bits. Essa conversão vai acarretar um erro na quantização da amplitude da tensão, medido em mV, de aproximadamente"),
ops:["10","40","60","100","200"], gab:"B",
aviso:"a banca chamou de \"erro de quantização\" o próprio passo (resolução) do conversor, 10/256 ≈ 39 mV. A rigor, o erro máximo de arredondamento é metade disso (≈ 20 mV), que não está nas alternativas.",

Q("18-53",{
enun:P("O circuito da figura controla a potência que uma fonte alternada V<sub>S</sub> entrega a uma carga resistiva R<sub>L</sub> = 30 Ω, por meio do disparo de um SCR (em antiparalelo com um diodo). As formas de onda de V<sub>S</sub> (pico 120 V, período 20 ms) e da tensão de disparo V<sub>G</sub> (pulsos em t = 5, 25, 45, 65 e 85 ms) estão representadas. Considerando ideais o diodo e o SCR, a corrente média, em ampères, que circula pelo SCR é igual a"),
fig:"f18_53", ops:["0","1/π","2/π","4/π","6/π"], gab:"C",
dicas:["Os pulsos ocorrem a 5 ms de cada período de 20 ms: ângulo de disparo α = 90°.","O SCR conduz de 90° a 180° de cada semiciclo positivo. I<sub>méd</sub> = (1/2π)∫<sub>π/2</sub><sup>π</sup>(V<sub>m</sub>/R)sen θ dθ."],
erros:{
A:"O SCR recebe pulso com polarização direta (pico do semiciclo positivo), então conduz. A corrente média não é zero.",

});

Q("18-56",{
enun:P("O circuito da figura é um conversor CC-CC que converte uma tensão não regulada V<sub>DC</sub> em uma tensão regulada V<sub>O</sub> numa carga R<sub>L</sub>, controlada pelo ciclo de trabalho da chave S<sub>1</sub>. Nesse conversor,"),

dicas:["Chave em série, diodo para a terra, indutor em série com a saída: é o conversor buck, V<sub>O</sub> = D·V<sub>DC</sub>.","Em regime permanente, qual é a tensão média num indutor? E a corrente média num capacitor?"],

A:"V<sub>O</sub> = D·V<sub>DC</sub>: se V<sub>DC</sub> sobe, D deve DIMINUIR para manter V<sub>O</sub>.",

C:"Inversão de polaridade é característica do buck-boost. Aqui a saída tem a mesma polaridade.",
E:"Em regime, a corrente média no capacitor é ZERO (ele carrega e descarrega igualmente). A corrente média da carga vem do indutor."},

Q("11-32",{
enun:P("A força motriz de um carro elétrico vem de um motor CC acionado por dois diodos, D<sub>1</sub> e D<sub>2</sub>, e duas chaves estáticas autocomutáveis, S<sub>1</sub> e S<sub>2</sub>, conforme a figura (V<sub>CC</sub> é a bateria). Em qualquer instante, uma das chaves está conduzindo e a outra não. Analise: I – A corrente i<sub>m</sub> pode fluir nos dois sentidos. II – O carro pode andar em marcha a ré, isto é, o sentido de rotação do motor pode ser invertido. III – É possível recuperar energia para a bateria durante a frenagem motora. É correto APENAS o que se afirma em"),

D:"II é falsa: este conversor de dois quadrantes não inverte a polaridade da tensão do motor."},
res:P("Meia-ponte: V<sub>m</sub> ≥ 0 sempre, i<sub>m</sub> nos dois sentidos (quadrantes 1 e 2). I verdadeira, III verdadeira (regeneração), II falsa. Alternativa <b>E</b>.")

B({
id:"b14", titulo:"Transitórios e circuitos no domínio s",
sub:"Circuitos RC, RL e RLC: constante de tempo, equações diferenciais, condições iniciais e funções de transferência por impedâncias.",
objetivos:["Escrever a resposta ao degrau de RC e RL com a constante de tempo certa","Montar a equação diferencial de um circuito simples","Achar funções de transferência por divisor de impedâncias em s","Incluir condições iniciais de L e C na transformada de Laplace","Montar um modelo em espaço de estados de um RLC"],
qs:["23-48","23-67","18-63","18-62","06-31","18-58"],
aula:
"<h3>1. Primeira ordem</h3>"+

P("Depois de 3τ a resposta chegou a 95%; depois de 5τ, a mais de 99%.")+

"<h3>3. Condições iniciais em Laplace</h3>"+
F("Capacitor: i = C·dv/dt → I(s) = C·[sV(s) − v(0)]<br>Indutor: v = L·di/dt → V(s) = L·[sI(s) − i(0)]")+
P("Roteiro para chave que muda em t = 0: (1) regime antes da manobra (C aberto, L curto) para achar v<sub>C</sub>(0) e i<sub>L</sub>(0); (2) circuito depois da manobra; (3) equações de nó em s com os termos de condição inicial.")+
