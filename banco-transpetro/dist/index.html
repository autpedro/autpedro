  {p:"Em quanto tempo o capacitor chega a 95% da carga (em s)?", v:30, tol:0.02, r:"1 − e<sup>−t/10</sup> = 0,95 ⇒ t = 10·ln 20 ≈ <b>30 s</b> (3τ).", dica:"e<sup>−3</sup> ≈ 0,05."},
  {p:"Qual a corrente no instante t = 0⁺ (em mA)?", v:0.4, r:"Em t = 0⁺ o capacitor descarregado age como curto: i = 20/50 k = <b>0,4 mA</b>.", dica:"Capacitor descarregado não tem tensão: no primeiro instante, toda a tensão da fonte está no resistor."}
 ],
 fecho:"A 23-48 é o passo 2 com t = 3τ."

Q("18-58",{

B({
id:"b15", titulo:"Controle I: funções de transferência, blocos e 2ª ordem",
sub:"Da equação diferencial à função de transferência, redução de diagramas de blocos, malha fechada e parâmetros ζ e ω<sub>n</sub>.",
objetivos:["Passar de equação diferencial para G(s) (e vice-versa)","Reduzir diagramas de blocos com realimentação, inclusive com compensador na realimentação","Ler ζ e ω<sub>n</sub> da forma padrão e da posição dos polos","Classificar respostas (sub, criticamente e superamortecida)"],
qs:["11-51","18-42","11-52","11-49","18-69","23-69","11-54","11-55","18-67"],
aula:
"<h3>1. Da EDO para G(s)</h3>"+
P("Com condições iniciais nulas, troque cada derivada de ordem k por s<sup>k</sup>. G(s) = Y(s)/X(s) = (polinômio do lado da entrada)/(polinômio do lado da saída). Simplifique fatores comuns (s que aparece no numerador e no denominador).")+
F("Exemplo: y'' + 3y' + 2y = 4x' + x ⇒ G(s) = (4s + 1)/(s² + 3s + 2)")+
"<h3>2. Realimentação</h3>"+
F("Realimentação negativa: T(s) = G/(1 + G·H) &nbsp;&nbsp; Unitária: T = G/(1 + G)<br>Com G = N<sub>G</sub>/D<sub>G</sub> e H = N<sub>H</sub>/D<sub>H</sub>: T = N<sub>G</sub>D<sub>H</sub>/(D<sub>G</sub>D<sub>H</sub> + N<sub>G</sub>N<sub>H</sub>)")+
TRAP("com compensador H na realimentação, o denominador de H aparece no NUMERADOR de T. Não basta somar as funções.")+
P("<b>Cadeia de integradores com realimentações:</b> se o sinal após o somador é e, as saídas dos integradores são e/s, e/s², e/s³. Cada realimentação −k de um ponto vira um termo k/s<sup>i</sup> na equação do somador.")+
"<h3>3. Segunda ordem</h3>"+
F("G(s) = ω<sub>n</sub>²/(s² + 2ζω<sub>n</sub>s + ω<sub>n</sub>²) &nbsp;&nbsp; polos: −ζω<sub>n</sub> ± jω<sub>n</sub>√(1 − ζ²)<br>|polo| = ω<sub>n</sub> &nbsp;&nbsp; cos(ângulo com o eixo real negativo) = ζ")+
"<ul><li>ζ &gt; 1: superamortecido (polos reais distintos). ζ = 1: crítico. 0 &lt; ζ &lt; 1: subamortecido (oscila). ζ = 0: oscilação pura.</li><li>Antes de ler os coeficientes, deixe s² com coeficiente 1 (divida tudo).</li></ul>",
exemplo:{
 titulo:"Exemplo: fechando a malha",
 enun:P("Planta G(s) = 9/[s(s + 2)] com realimentação unitária negativa."),
 passos:[
  {p:"Qual o polinômio característico? Dê o coeficiente do termo em s.", v:2, r:"T = 9/(s² + 2s + 9): coeficiente de s = <b>2</b>.", dica:"T = G/(1 + G) ⇒ denominador s(s + 2) + 9."},
  {p:"Qual ω<sub>n</sub> (rad/s)?", v:3, r:"ω<sub>n</sub>² = 9 ⇒ <b>ω<sub>n</sub> = 3 rad/s</b>.", dica:"Compare com s² + 2ζω<sub>n</sub>s + ω<sub>n</sub>²."},
  {p:"Qual ζ? (3 casas)", v:0.333, tol:0.01, r:"2ζ·3 = 2 ⇒ <b>ζ = 1/3 ≈ 0,333</b> (subamortecido).", dica:"2ζω<sub>n</sub> = coeficiente de s."},
  {p:"Qual a parte imaginária dos polos (rad/s)? (3 casas)", v:2.828, tol:0.01, r:"Polos: −1 ± j√8 = −1 ± <b>j2,828</b>.", dica:"Resolva s² + 2s + 9 = 0, ou use ω<sub>n</sub>√(1 − ζ²)."}
 ],
 fecho:"A 18-69 é este exemplo com outros números."
}
});

B({
id:"b16", titulo:"Controle II: estabilidade, lugar das raízes e espaço de estados",
sub:"Critério de Routh-Hurwitz (ganho crítico e frequência de oscilação), leitura do lugar das raízes, alocação de polos e conversões espaço de estados ↔ função de transferência.",
objetivos:["Achar o ganho crítico e a frequência de oscilação pelo arranjo de Routh","Ler polos, zeros e estabilidade num lugar das raízes","Fazer alocação de polos com realimentação de estados","Calcular G(s) = C(sI − A)⁻¹B + D e montar a forma canônica controlável"],
qs:["06-29","18-36","11-47","23-68","18-40","18-41","23-47","18-38","23-46","23-45"],
aula:
"<h3>1. Routh-Hurwitz para cúbicas</h3>"+
F("s³ + a<sub>2</sub>s² + a<sub>1</sub>s + a<sub>0</sub>: estável ⇔ todos &gt; 0 e a<sub>2</sub>·a<sub>1</sub> &gt; a<sub>0</sub><br>Limiar (oscilação pura): a<sub>2</sub>·a<sub>1</sub> = a<sub>0</sub> &nbsp;⇒&nbsp; polos em ±jω com ω² = a<sub>1</sub> (= a<sub>0</sub>/a<sub>2</sub>)")+
P("Com o ganho K somado ao termo independente (a<sub>0</sub> = c + K), resolva a<sub>2</sub>a<sub>1</sub> = c + K para o K crítico. A frequência de oscilação sai da linha de s² do arranjo: a<sub>2</sub>s² + a<sub>0</sub> = 0.")+
"<h3>2. Lugar das raízes (realimentação negativa, K ≥ 0)</h3>"+
"<ul><li>Começa nos polos de malha aberta (K = 0) e termina nos zeros (ou no infinito).</li><li>No eixo real, existe à esquerda de um número ÍMPAR de polos + zeros reais.</li><li>Polos (×) em 0 e −8 e zero (○) em −10 ⇒ G = K(s + 10)/[s(s + 8)].</li><li>Estabilidade: todos os polos de malha fechada no semiplano esquerdo. Um ramo que começa no semiplano direito e cruza o eixo jω torna o sistema estável a partir de certo K.</li><li>Polo de malha fechada na origem: o termo independente do polinômio característico zera.</li></ul>"+
"<h3>3. Espaço de estados</h3>"+
F("ẋ = Ax + Bu, y = Cx + Du<br>G(s) = C(sI − A)⁻¹B + D &nbsp;&nbsp; polos = autovalores de A: det(sI − A) = 0<br>Inversa 2×2: [a b; c d]⁻¹ = [d −b; −c a]/(ad − bc)")+
P("<b>Realimentação de estados</b> u = −Kx + r: a nova matriz é A − BK. Iguale det(sI − (A − BK)) ao polinômio desejado.")+

dicas:["G(s) = C(sI − A)⁻¹B + D. det(sI − A) = s² + 7s + 12.","(sI − A)⁻¹ = [s 1; −12 s + 7]/Δ. Só a 1ª linha interessa (C = [1 0]). Não esqueça o D = 4."],
erros:{
A:"−3 e −4 são os POLOS (raízes de s² + 7s + 12), não os zeros.",
B:"Confira o numerador: 4(s² + 7s + 12) + (−16s − 40) = 4s² + 12s + 8.",
C:"Refaça a 1ª linha de (sI − A)⁻¹B: s·(−16) + 1·(−40) = −16s − 40.",
D:"O numerador é 4s² + 12s + 8 = 4(s + 1)(s + 2). Confira a fatoração."},
res:OL(["Δ = s(s + 7) + 12 = s² + 7s + 12 = (s + 3)(s + 4).","C(sI − A)⁻¹B = [s, 1]·[−16; −40]/Δ = (−16s − 40)/Δ.","G = (−16s − 40)/Δ + 4 = (4s² + 12s + 8)/Δ = 4(s + 1)(s + 2)/[(s + 3)(s + 4)].","Zeros: <b>−1 e −2</b>."])
});

B({
id:"b17", titulo:"Sinais: Laplace, transformada Z e números complexos",
sub:"Tabela básica de Laplace, frações parciais, funções complexas, transformada Z, equações a diferenças e modelos discretos em espaço de estados.",
objetivos:["Transformar e anti-transformar por frações parciais (Laplace e Z)","Separar parte real e imaginária de funções complexas","Gerar amostras de uma resposta ao impulso discreta por divisão longa ou equação a diferenças","Achar polos e função de transferência de modelos discretos em espaço de estados"],
qs:["11-50","23-64","23-65","23-43","18-37","23-66","18-68","23-70","18-39","18-60"],
aula:
"<h3>1. Laplace: o mínimo indispensável</h3>"+
F("e<sup>at</sup> ↔ 1/(s − a) &nbsp;&nbsp; 1 ↔ 1/s &nbsp;&nbsp; t ↔ 1/s² &nbsp;&nbsp; sen ωt ↔ ω/(s² + ω²) &nbsp;&nbsp; cos ωt ↔ s/(s² + ω²)<br>Linearidade: a·f + b·g ↔ a·F + b·G")+
P("<b>Frações parciais (polos simples):</b> 1/[(s − p<sub>1</sub>)(s − p<sub>2</sub>)] = A/(s − p<sub>1</sub>) + B/(s − p<sub>2</sub>), com A = 1/(p<sub>1</sub> − p<sub>2</sub>) (tampe o fator e substitua s = p<sub>1</sub>).")+
"<h3>2. Funções complexas</h3>"+
P("Para separar 1/(a + jb), multiplique pelo conjugado: (a − jb)/(a² + b²). Ângulo de um quociente = ângulo do numerador − ângulo do denominador.")+
"<h3>3. Transformada Z</h3>"+
F("aⁿu(n) ↔ z/(z − a) &nbsp;&nbsp; u(n) ↔ z/(z − 1) &nbsp;&nbsp; δ(n) ↔ 1 &nbsp;&nbsp; x(n − 1) ↔ z⁻¹X(z)")+
P("<b>Truque:</b> para anti-transformar, expanda X(z)/z em frações parciais e depois multiplique por z: cada termo vira A·z/(z − p) ↔ A·pⁿ.")+
P("<b>Primeiras amostras:</b> escreva G(z) em potências de z⁻¹ e use a equação a diferenças. Para G = (b<sub>0</sub> + b<sub>1</sub>z⁻¹ + …)/(1 + a<sub>1</sub>z⁻¹ + …), y(n) = −a<sub>1</sub>y(n−1) − … + b<sub>0</sub>x(n) + b<sub>1</sub>x(n−1) + …")+
TRAP("ao passar de z para z⁻¹, divida numerador E denominador pela maior potência de z do denominador. Se o numerador tiver grau menor, a resposta começa com zeros (atraso).")+
"<h3>4. Discreto em espaço de estados</h3>"+
F("x(k + 1) = Φx(k) + Γu(k), y = Cx &nbsp;&nbsp; G(z) = C(zI − Φ)⁻¹Γ &nbsp;&nbsp; polos: det(zI − Φ) = 0"),
exemplo:{
 titulo:"Exemplo: da transformada Z às amostras",
 enun:P("Considere X(z) = z(2z − 3)/[(z − 1)(z − 2)]."),
 passos:[
  {p:"Expanda X(z)/z = A/(z − 1) + B/(z − 2). Quanto vale A?", v:1, r:"A = (2·1 − 3)/(1 − 2) = (−1)/(−1) = <b>1</b>.", dica:"Tampe (z − 1) e substitua z = 1 no resto: (2z − 3)/(z − 2)."},
  {p:"Quanto vale B?", v:1, r:"B = (2·2 − 3)/(2 − 1) = <b>1</b>.", dica:"Tampe (z − 2) e substitua z = 2."},
  {p:"Logo x(n) = u(n) + 2ⁿu(n). Quanto vale x(3)?", v:9, r:"x(3) = 1 + 2³ = <b>9</b>.", dica:"z/(z − a) ↔ aⁿ."},
  {p:"Confira pela equação a diferenças: X = (2 − 3z⁻¹)/(1 − 3z⁻¹ + 2z⁻²). Calcule x(1).", v:3, r:"x(0) = 2; x(1) = 3·x(0) − 3 = <b>3</b> (= 1 + 2¹ ✓).", dica:"x(n) = 3x(n−1) − 2x(n−2) + 2δ(n) − 3δ(n−1)."}
 ],
 fecho:"A 18-37 e a 23-66 usam exatamente esse vai e volta."
}
});

Q("11-50",{
enun:P("Considere o sinal causal v(t) = 10e<sup>−2t</sup> − 5e<sup>−5t</sup> para t ≥ 0 e nulo para t &lt; 0. A transformada de Laplace de v(t) é"),
ops:["5/(s² + 7s + 10)","5(s + 8)/(s² + 7s + 10)","(s + 8)/(s² − 7s + 10)","(5s + 10)/(s² + 7s − 10)","8/(s² − 7s + 10)"], gab:"B",
dicas:["10/(s + 2) − 5/(s + 5).","Denominador comum (s + 2)(s + 5) = s² + 7s + 10. Numerador: 10(s + 5) − 5(s + 2)."],
erros:{
A:"O numerador deve depender de s: 10(s + 5) − 5(s + 2) = 5s + 40.",
C:"e<sup>−2t</sup> ↔ 1/(s + 2): o denominador fica s² + 7s + 10 (sinais positivos). E falta o fator 5.",
D:"(s + 2)(s + 5) = s² + 7s + 10 (termo constante positivo). Refaça o numerador.",
E:"Sinais do denominador e numerador errados. Use e<sup>at</sup> ↔ 1/(s − a) com a = −2 e −5."},
res:P("V(s) = 10/(s + 2) − 5/(s + 5) = [10s + 50 − 5s − 10]/[(s + 2)(s + 5)] = <b>5(s + 8)/(s² + 7s + 10)</b>.")
});

Q("23-64",{
enun:P("Sabe-se que a Transformada de Laplace de f(t) = e<sup>at</sup>, t ≥ 0, é F(s) = 1/(s − a). A Transformada Inversa de G(s) = 1/(s² − 5s + 6), para t ≥ 0, é"),
ops:["e<sup>2t</sup> + e<sup>3t</sup>","e<sup>−2t</sup> + e<sup>−3t</sup>","e<sup>2t</sup> − e<sup>3t</sup>","e<sup>3t</sup> − e<sup>2t</sup>","e<sup>3t</sup> + e<sup>t</sup>"], gab:"D",
dicas:["s² − 5s + 6 = (s − 2)(s − 3).","1/[(s − 2)(s − 3)] = A/(s − 2) + B/(s − 3), com A = 1/(2 − 3)."],
erros:{
A:"Os coeficientes das frações parciais não são ambos +1: A = 1/(2 − 3) = −1.",
B:"As raízes são +2 e +3 (s² − 5s + 6): as exponenciais são crescentes.",
C:"Sinais trocados: A = −1 (termo e<sup>2t</sup>) e B = +1 (termo e<sup>3t</sup>).",
E:"As raízes de s² − 5s + 6 são 2 e 3, não 1 e 3."},
res:P("A = 1/(2 − 3) = −1; B = 1/(3 − 2) = 1. G = −1/(s − 2) + 1/(s − 3) ⇒ <b>g(t) = e<sup>3t</sup> − e<sup>2t</sup></b>.")
});

Q("23-65",{
enun:P("Considere a função f(z) = 1/(z + 1), de variável complexa z = x + jy. Decompondo em partes real e imaginária, f(z) = u(x, y) + jv(x, y). A expressão de v(x, y) é"),
ops:["x/(x² + y²)","−y/(x² + y² + 2x + 1)","y/(x² + y² + 2x + 1)","(x + 1)/(x² + y² + 2x + 1)","2/(x² + y² + 2x)"], gab:"B",
dicas:["f = 1/[(x + 1) + jy]. Multiplique pelo conjugado (x + 1) − jy.","Denominador: (x + 1)² + y² = x² + 2x + 1 + y²."],
erros:{
A:"Não esqueça o +1 em z + 1: o denominador é (x + 1)² + y².",
C:"O sinal: ao multiplicar pelo conjugado, a parte imaginária do numerador é −y.",
D:"(x + 1)/[(x + 1)² + y²] é a parte REAL u(x, y).",
E:"Refaça a multiplicação pelo conjugado; o numerador da parte imaginária é −y."},

});

Q("18-68",{
enun:P("Considere o processo industrial modelado por Y(z)/U(z) = (10z + M)/(z² − 1,2z + 0,2), discreto e causal (y(k) = 0 para k &lt; 0). Sabendo que a resposta ao impulso unitário é y(k) = {0, 10, 17, …}, qual é o valor do parâmetro M?"),
ops:["1","3","5","7","9"], gab:"C",
dicas:["Em z⁻¹: (10z⁻¹ + Mz⁻²)/(1 − 1,2z⁻¹ + 0,2z⁻²).","y(k) = 1,2y(k − 1) − 0,2y(k − 2) + 10u(k − 1) + Mu(k − 2). Com impulso: y(2) = 1,2·10 + M."],
erros:{
A:"Com M = 1, y(2) = 12 + 1 = 13 ≠ 17.",

B({
id:"b18", titulo:"Matemática: álgebra linear, otimização e probabilidade",
sub:"Determinantes, posto e solução de sistemas, transformações lineares e composição, rotação no plano, sistemas em blocos, máximo de áreas e densidade de probabilidade.",
objetivos:["Calcular determinantes (inclusive de blocos e de k·M)","Decidir se um sistema tem solução única, infinitas ou nenhuma pelo posto","Compor transformações lineares e usar linearidade para achar imagens","Reconhecer uma matriz de rotação","Montar sistemas na forma matricial e eliminar variáveis por blocos (complemento de Schur)"],
qs:["11-58","18-66","11-70","18-65","11-69","11-56","11-57","11-61","18-54","11-59","18-64","11-53"],
aula:
"<h3>1. Determinantes</h3>"+
"<ul><li>det(k·M) = kⁿ·det(M) para M de ordem n.</li><li>Matriz bloco-diagonal (ou triangular por blocos): det = produto dos determinantes dos blocos.</li><li>Expansão de Laplace: escolha a linha/coluna com mais zeros.</li><li>Uma linha que é combinação das outras ⇒ det = 0.</li></ul>"+
"<h3>2. Posto e sistemas M·x = y</h3>"+
"<ul><li>Posto (rank) = número de linhas (ou colunas) linearmente independentes. Nulidade = nº de colunas − posto.</li><li>Teorema de Rouché-Capelli: posto(M) = posto([M | y]) = n ⇒ solução única; = &lt; n ⇒ infinitas; posto(M) &lt; posto([M | y]) ⇒ nenhuma.</li><li>det(M) = 0 (M quadrada) ⇒ não há solução única.</li></ul>"+
"<h3>3. Transformações lineares</h3>"+
F("Composição: T<sub>3</sub> = T<sub>2</sub>∘T<sub>1</sub> ⇒ [T<sub>3</sub>] = [T<sub>2</sub>]·[T<sub>1</sub>] (a última aplicada vem à ESQUERDA)<br>Linearidade: se v<sub>3</sub> = a·v<sub>1</sub> + b·v<sub>2</sub>, então T(v<sub>3</sub>) = a·T(v<sub>1</sub>) + b·T(v<sub>2</sub>)<br>Rotação de θ (anti-horária): [cos θ  −sen θ; sen θ  cos θ]")+
"<h3>4. Sistemas por blocos</h3>"+
F("[Z<sub>1</sub> Z<sub>2</sub>; Z<sub>3</sub> Z<sub>4</sub>]·[x<sub>a</sub>; x<sub>b</sub>] = [y; 0] ⇒ x<sub>b</sub> = −Z<sub>4</sub>⁻¹Z<sub>3</sub>x<sub>a</sub> ⇒ (Z<sub>1</sub> − Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub>)x<sub>a</sub> = y")+
P("É a mesma conta da redução de Kron em matrizes de admitância.")+
"<h3>5. Otimização e probabilidade</h3>"+
"<ul><li>Retângulo inscrito num triângulo com um lado sobre a base: área máxima = metade da área do triângulo (altura do retângulo = metade da altura do triângulo).</li><li>Função densidade de probabilidade: área total sob a curva = 1.</li></ul>",
exemplo:{
 titulo:"Exemplo: sistema linear com Rouché-Capelli",
 enun:P("Considere M = "+M("1 2 3;2 4 6;1 0 1")+" e y = [6; 12; 2]."),
 passos:[
  {p:"Qual o determinante de M?", v:0, r:"A 2ª linha é 2 × a 1ª ⇒ <b>det M = 0</b>.", dica:"Compare as duas primeiras linhas."},
  {p:"Qual o posto de M?", v:2, r:"Linhas 1 e 3 são independentes ⇒ <b>posto 2</b>.", dica:"Quantas linhas independentes sobram depois de descartar a repetida?"},
  {p:"Qual o posto da matriz aumentada [M | y]?", v:2, r:"y<sub>2</sub> = 12 = 2·y<sub>1</sub>: a linha 2 continua proporcional à 1 ⇒ <b>posto 2</b>.", dica:"Veja se a proporção entre as linhas 1 e 2 vale também para y."},
  {p:"Quantos parâmetros livres tem a solução (n − posto)?", v:1, r:"3 − 2 = <b>1</b>: infinitas soluções (uma reta).", dica:"Postos iguais e menores que n ⇒ infinitas soluções."}
 ],
 fecho:"Na 11-56 a aumentada tem posto MAIOR que M. Que conclusão isso traz?"
}
});

Q("11-56",{
enun:P("Com respeito à equação M·x = y, em que M = "+M("4 5 2 −3;3 8 9 1;5 7 3 −4;7 6 6 0")+" e y = [6; 3; 8; 9], analise: I – A equação apresenta uma única solução. II – O posto da matriz M é igual a 4. III – A nulidade da matriz M é igual a 1. É correto APENAS o que se afirma em"),

dicas:["Teste se as linhas são independentes. Compare linha 1 + linha 2 com linhas 3 e 4, ou calcule o determinante.","Dica: M·[0; 1; −1; 1] = 0. O que isso diz sobre o posto?"],
erros:{
A:"det(M) = 0 (existe vetor não nulo v com Mv = 0), então não há solução única.",
B:"Se o posto fosse 4, M seria inversível. Mas M·[0; 1; −1; 1] = [0; 0; 0; 0].",
D:"I e II são falsas: o posto é 3 (det = 0).",

});

Q("11-57",{
enun:P("No sistema "+M("Z<sub>1(3×3)</sub> Z<sub>2(3×2)</sub>;Z<sub>3(2×3)</sub> Z<sub>4(2×2)</sub>")+"·[x<sub>1</sub>; …; x<sub>5</sub>] = [y<sub>1</sub>; y<sub>2</sub>; y<sub>3</sub>; 0; 0], Z<sub>1</sub>…Z<sub>4</sub> são submatrizes. Deseja-se calcular x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub> pelo sistema reduzido M<sub>(3×3)</sub>·[x<sub>1</sub>; x<sub>2</sub>; x<sub>3</sub>] = [y<sub>1</sub>; y<sub>2</sub>; y<sub>3</sub>]. A matriz M, em função de Z<sub>1</sub>, Z<sub>2</sub>, Z<sub>3</sub> e Z<sub>4</sub>, é"),
ops:["Z<sub>1</sub> + Z<sub>2</sub>Z<sub>4</sub>Z<sub>3</sub>","Z<sub>1</sub> − Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub>","Z<sub>1</sub> − Z<sub>3</sub>Z<sub>4</sub>⁻¹Z<sub>2</sub>","Z<sub>1</sub>Z<sub>2</sub>Z<sub>4</sub>Z<sub>3</sub>","Z<sub>1</sub>Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub>"], gab:"B",
dicas:["Linha de baixo: Z<sub>3</sub>x<sub>a</sub> + Z<sub>4</sub>x<sub>b</sub> = 0 ⇒ x<sub>b</sub> = ?","Substitua na linha de cima: Z<sub>1</sub>x<sub>a</sub> + Z<sub>2</sub>x<sub>b</sub> = y."],
erros:{
A:"Para isolar x<sub>b</sub> é preciso INVERTER Z<sub>4</sub>, e o sinal fica negativo.",
C:"Confira as dimensões: Z<sub>3</sub> é 2×3 e Z<sub>4</sub>⁻¹ é 2×2; Z<sub>3</sub>Z<sub>4</sub>⁻¹ não está definido. A ordem é Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub>.",
D:"Produtos de todas as submatrizes não surgem da eliminação; o resultado é uma DIFERENÇA.",
E:"Falta o Z<sub>1</sub> somado (com sinal de menos no termo de correção), e não multiplicado."},
res:P("Z<sub>3</sub>x<sub>a</sub> + Z<sub>4</sub>x<sub>b</sub> = 0 ⇒ x<sub>b</sub> = −Z<sub>4</sub>⁻¹Z<sub>3</sub>x<sub>a</sub>. Então Z<sub>1</sub>x<sub>a</sub> − Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub>x<sub>a</sub> = y ⇒ <b>M = Z<sub>1</sub> − Z<sub>2</sub>Z<sub>4</sub>⁻¹Z<sub>3</sub></b> (complemento de Schur, redução de Kron).")
});

B({
id:"b19", titulo:"Física aplicada: termodinâmica, fluidos, calor e eletromagnetismo",
sub:"1ª lei, processos de gás ideal, ciclos e rendimento de Carnot, Pascal, Pitot, Torricelli, leis de semelhança de bombas, raio crítico de isolamento, força magnética e análise dimensional.",
objetivos:["Aplicar a 1ª lei a processos isotérmicos, adiabáticos e isobáricos","Calcular trabalho como área sob a curva no diagrama P-V","Usar temperaturas absolutas no rendimento de Carnot","Resolver problemas de prensa hidráulica, Pitot e jato de Torricelli","Aplicar as leis de semelhança de bombas centrífugas","Usar o raio crítico de isolamento e a força de Lorentz"],
qs:["06-30","06-32","08-35","11-63","11-64","11-65","11-60","11-66","11-67","11-62","11-68","18-50","18-59","23-61","23-60"],
aula:
"<h3>1. Termodinâmica</h3>"+
F("1ª lei: ΔU = Q − W (W = trabalho realizado PELO gás)<br>Gás ideal: U depende só de T ⇒ isotérmico: ΔU = 0 ⇒ Q = W<br>Adiabático: Q = 0 (recipiente isolado ou processo muito rápido) ⇒ ΔU = −W<br>Trabalho: W = ∫P dV = área sob a curva no diagrama P-V")+
P("O trabalho depende do CAMINHO entre os estados (não é função de estado). A variação de energia interna depende só dos estados inicial e final.")+
F("Carnot: η = 1 − T<sub>fria</sub>/T<sub>quente</sub> (temperaturas em KELVIN)<br>Ciclo de Carnot: 2 isotérmicas + 2 adiabáticas")+
TRAP("usar °C no rendimento de Carnot. 273 °C não é \"metade\" de 546 °C em termos absolutos.")+
"<h3>2. Fluidos</h3>"+
"<ul><li><b>Pascal (prensa):</b> F<sub>1</sub>/A<sub>1</sub> = F<sub>2</sub>/A<sub>2</sub>; com êmbolos na mesma altura, m<sub>2</sub> = m<sub>1</sub>·(d<sub>2</sub>/d<sub>1</sub>)².</li><li><b>Pitot com manômetro:</b> ρ<sub>1</sub>v²/2 = (ρ<sub>2</sub> − ρ<sub>1</sub>)gΔh ≈ ρ<sub>2</sub>gΔh ⇒ v = √(2gΔh·ρ<sub>2</sub>/ρ<sub>1</sub>).</li><li><b>Torricelli:</b> orifício a uma profundidade y abaixo da superfície: v = √(2gy). Saindo na horizontal a uma altura h do chão: alcance x = 2√(y·h).</li></ul>"+
"<h3>3. Leis de semelhança de bombas centrífugas</h3>"+
F("Q ∝ n·D³ &nbsp;&nbsp; H ∝ n²·D² &nbsp;&nbsp; P ∝ n³·D⁵<br>Motor: n ≈ 120f/p (síncrono exato)")+
"<h3>4. Transferência de calor</h3>"+
F("Raio crítico de isolamento (cilindro): r<sub>c</sub> = k/h")+
P("Abaixo de r<sub>c</sub>, aumentar a espessura AUMENTA a troca de calor (a área externa cresce mais que a resistência de condução). A troca é máxima com raio externo igual a r<sub>c</sub>.")+
"<h3>5. Eletromagnetismo</h3>"+
F("Força de Lorentz: F = q·v × B (perpendicular a v ⇒ não muda |v|)<br>v ∥ B ⇒ F = 0 ⇒ movimento retilíneo uniforme<br>a = ω × v com ω ⊥ v ⇒ movimento circular de raio |v|/|ω|")+
"<h3>6. Análise dimensional</h3>"+
P("Isole a constante e substitua as unidades de cada grandeza. Energia: J = W·s. Se a grandeza for \"por massa\", aparece kg⁻¹."),

 ],

}
});

B({
id:"b20", titulo:"Setor elétrico, energia, tarifas e normas",
sub:"Estrutura do setor (ANEEL, CCEE, desverticalização), contratos, tarifas horo-sazonais, fator de carga, fontes renováveis, termelétricas, NR-10 e licitações.",
objetivos:["Saber o papel de cada instituição do setor elétrico","Distinguir tarifas azul e verde e o efeito do fator de carga","Avaliar afirmações sobre fontes renováveis e termelétricas com critério técnico","Aplicar NR-10 (qualificado, habilitado, capacitado, autorizado) e a modalidade de licitação certa"],
qs:["06-35","06-40","08-34","08-36","06-38","08-38","08-37","06-37","06-34","06-33","06-39","08-39","08-40","23-53","23-58"],
aula:
"<h3>1. Instituições</h3>"+
"<ul><li><b>MME:</b> formula a política energética.</li><li><b>ANEEL:</b> agência reguladora: regula e fiscaliza, define as TARIFAS.</li><li><b>ONS:</b> opera o sistema interligado.</li><li><b>CCEE:</b> contabiliza e liquida a comercialização de energia (contratos no ACR e ACL).</li><li><b>EPE:</b> planejamento.</li><li><b>Eletrobras:</b> holding estatal de geração e transmissão.</li></ul>"+
P("<b>Reforma do setor:</b> a competição veio da <b>desverticalização</b>, separando geração, transmissão, distribuição e comercialização. Geração e comercialização são competitivas; transmissão e distribuição são monopólios naturais regulados.")+
P("<b>Contratos na CCEE:</b> bilaterais (ACL), CCEAR (ambiente regulado, leilões), Itaipu, PROINFA, entre outros. Banco (BNDES) financia, não é contrato registrado.")+
"<h3>2. Tarifas e fator de carga</h3>"+
"<ul><li><b>Horo-sazonal azul:</b> valores DIFERENCIADOS de demanda e de consumo para ponta e fora de ponta.</li><li><b>Horo-sazonal verde:</b> demanda ÚNICA; consumo diferenciado por posto horário.</li><li><b>Convencional:</b> sem diferenciação horária.</li></ul>"+
F("Fator de carga FC = demanda média / demanda máxima (0 &lt; FC ≤ 1)")+
P("FC próximo de 1 = uso uniforme: para o mesmo consumo, a demanda máxima é menor. Isso reduz a demanda contratada e otimiza o dimensionamento de cabos e transformadores. FC não tem relação com fator de potência.")+
"<h3>3. Fontes</h3>"+
"<ul><li><b>Termelétricas:</b> construção mais rápida e próximas da carga, mas com custo OPERACIONAL alto (combustível). Ciclo combinado: o calor dos gases de escape da turbina a gás gera vapor para uma turbina a vapor (maior rendimento).</li><li><b>Hidrelétricas:</b> custo de operação baixo, construção longa. Grande potencial remanescente na Amazônia, longe da carga e com restrições ambientais.</li><li><b>Renováveis:</b> eólica já opera em grande escala; nenhuma fonte é \"totalmente limpa\" no ciclo de vida (fabricação de painéis, por exemplo). PCHs servem bem a locais com recurso hídrico e dificuldade de transmissão.</li></ul>"+
TRAP("palavras absolutas (\"totalmente\", \"todos\", \"somente\", \"sempre\") costumam tornar falsa uma afirmação desse tema.")+
"<h3>4. NR-10 e licitação</h3>"+
"<ul><li><b>Qualificado:</b> curso específico reconhecido pelo sistema oficial de ensino. <b>Habilitado:</b> qualificado e com registro no conselho de classe. <b>Capacitado:</b> treinado sob orientação e responsabilidade de profissional habilitado e autorizado. <b>Autorizado:</b> qualificado/capacitado/habilitado com anuência formal da empresa.</li><li><b>Pregão:</b> modalidade para bens e serviços comuns, com padrões objetivamente definidos no edital (EPI, EPC, ferramentas).</li></ul>",
exemplo:{
 titulo:"Exemplo: fator de carga e demanda",

  {p:"Qual o fator de carga?", v:0.4, r:"FC = 100/250 = <b>0,4</b>.", dica:"FC = média/máxima."},
  {p:"Se, deslocando cargas, o FC subir para 0,8 com o mesmo consumo, qual a nova demanda máxima (kW)?", v:125, r:"D<sub>máx</sub> = 100/0,8 = <b>125 kW</b>: metade da demanda a contratar, com o mesmo consumo.", dica:"Mesmo consumo ⇒ mesma demanda média."}
 ],

}

<script>

try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (!st.last || !BLOCOS.find(b => b.id === st.last)) st.last = BLOCOS[0].id;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
function qs(id){ return st.q[id] || (st.q[id] = {ok:false, tries:0, elim:[], hint:0, show:false, errou:false}); }

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET = ["A","B","C","D","E","F"];
const provaNome = {"06":"Transpetro 2006 · Prova 37","08":"Transpetro 2008 · Prova 8","11":"Transpetro 2011 · Prova 9","18":"Transpetro 2018 · PSP RH 2018.1","23":"Transpetro 2023 · PSP 2023.2"};

let sample = null;
if (window.claude && window.claude.use) {
  window.claude.use("sample").then(s => { sample = s; document.querySelectorAll(".ai").forEach(el => el.hidden = !s); }).catch(() => {});
}

/* ---------- navegação ---------- */
function blockStats(b){
  let ok = 0; b.qs.forEach(id => { if (st.q[id] && st.q[id].ok) ok++; });
  return {ok, n:b.qs.length};
}
function renderNav(){
  const cur = st.last || BLOCOS[0].id;
  let tot = 0, totok = 0;
  const items = BLOCOS.map((b, i) => {
    const s = blockStats(b); tot += s.n; totok += s.ok;
    return `<li><button data-b="${b.id}" aria-current="${b.id===cur}"><span class="bn">${String(i+1).padStart(2,"0")}</span><span class="bt">${b.titulo}</span><span class="bp num">${s.ok}/${s.n} questões resolvidas</span></button></li>`;
  }).join("");
  $("#blist").innerHTML = items;
  const pct = tot ? Math.round(100*totok/tot) : 0;
  $("#overall").innerHTML = `<div class="num">${totok} de ${tot} questões resolvidas (${pct}%)</div><div class="bar"><i style="width:${pct}%"></i></div>`;
  $("#msel").innerHTML = BLOCOS.map((b,i) => { const s = blockStats(b); return `<option value="${b.id}" ${b.id===cur?"selected":""}>${String(i+1).padStart(2,"0")} · ${b.titulo} (${s.ok}/${s.n})</option>`; }).join("");
}

  const b = BLOCOS.find(x => x.id === st.last) || BLOCOS[0];

  if (st.tab === "aula") html += renderAula(b);
  else if (st.tab === "exemplo") html += renderExemplo(b);
  else html += renderQuestoes(b);
  const nav = [];
  if (idx > 0) nav.push(`<button class="btn" data-b="${BLOCOS[idx-1].id}">← ${BLOCOS[idx-1].titulo}</button>`);
  if (idx < BLOCOS.length-1) nav.push(`<button class="btn" data-b="${BLOCOS[idx+1].id}">${BLOCOS[idx+1].titulo} →</button>`);
  html += `<div class="actions" style="justify-content:space-between">${nav.join("")}</div>`;

}

function renderAula(b){
  const intro = b === BLOCOS[0] ? `<section class="fb note"><p><b>Como usar:</b> em cada bloco, leia a <b>Aula</b> (curta, só o que cai), resolva o <b>Exemplo guiado</b> passo a passo e depois faça as <b>Questões da prova</b>. Se errar, o banco mostra onde o raciocínio falhou e você tenta de novo; a resolução só abre depois de acertar ou de insistir. Seu progresso fica salvo neste navegador.</p></section>` : "";

  <article class="prose">${b.aula}</article>
  <div class="actions"><button class="btn pri" data-tab="exemplo">Praticar no exemplo guiado →</button></div>`;
}

function renderExemplo(b){
  const ex = b.exemplo; const es = st.ex[b.id] || (st.ex[b.id] = {step:0, tries:{}, shown:{}});

  <p class="empty">Resolva passo a passo. Escreva sua resposta antes de conferir; o passo seguinte só abre depois.</p></section>`;
  ex.passos.forEach((p, i) => {
    const locked = i > es.step;

    const tr = es.tries[i] || 0;
    html += `<div class="step ${locked?"locked":""}" data-step="${i}">

      if (done) html += `<div class="fb ok"><span class="t">✓ Resposta do passo</span><p>${p.r}</p></div>`;

        if (tr > 0 && p.v !== undefined) html += `<div class="fb err"><span class="t">Ainda não</span><p>${p.dica || "Revise a fórmula e as unidades deste passo."}</p></div>`;
        if (tr >= 2) html += `<div class="actions"><button class="btn warn" data-exshow="${i}">Mostrar este passo</button></div>`;
      }
    }
    html += `</div>`;
  });
  if (es.step >= ex.passos.length) html += `<div class="fb ok"><span class="t">Exemplo concluído</span><p>${ex.fecho || "Agora aplique o mesmo raciocínio nas questões da prova."}</p></div><div class="actions"><button class="btn pri" data-tab="questoes">Ir para as questões →</button><button class="btn" data-exreset="1">Refazer exemplo</button></div>`;
  return html;
}
function parseNum(s){ s = String(s).trim().replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",", "."); const m = s.match(/-?\d+(\.\d+)?(e-?\d+)?/i); return m ? parseFloat(m[0]) : NaN; }

/* ---------- questões ---------- */
function figHtml(f){ return `<div class="figs">${[].concat(f).map(x => `<img src="figs/${x}.png" alt="Figura da questão" loading="lazy">`).join("")}</div>`; }
function renderQuestoes(b){
  const f = st.filtro;
  const ids = b.qs.filter(id => { const s = st.q[id]; if (f==="pend") return !(s && s.ok); if (f==="erradas") return s && s.errou; return true; });
  let html = `<div class="qtools"><label for="filtro">Mostrar</label><select id="filtro"><option value="todas" ${f==="todas"?"selected":""}>Todas</option><option value="pend" ${f==="pend"?"selected":""}>Só as não resolvidas</option><option value="erradas" ${f==="erradas"?"selected":""}>Só as que já errei</option></select><span>Errou? Você vê onde o raciocínio falhou e tenta de novo. A resolução só aparece depois.</span></div>`;
  if (!ids.length) html += `<p class="empty">Nenhuma questão neste filtro.</p>`;
  ids.forEach(id => html += renderQ(id));
  return html;
}
function renderQ(id){
  const q = QS[id]; const s = qs(id);
  const [ano, n] = id.split("-");
  const status = s.ok ? `<span class="chip ok">resolvida</span>` : (s.tries ? `<span class="chip try">${s.tries} tentativa${s.tries>1?"s":""}</span>` : "");
  let h = `<article class="q ${s.ok?"ok":""}" id="q-${id}" data-q="${id}">
    <div class="qhead"><span class="chip">${provaNome[ano]} · Questão ${parseInt(n,10)}</span>${status}</div>`;
  if (q.aviso) h += `<div class="aviso"><b>Atenção:</b> ${q.aviso}</div>`;
  h += `<div class="enun">${q.enun}</div>`;
  if (q.fig) h += figHtml(q.fig);
  if (q.tipo === "vf") h += renderVF(q, s, id); else h += renderMC(q, s, id);
  h += `</article>`;
  return h;
}
function renderMC(q, s, id){
  let h = `<div class="ops" role="radiogroup">`;
  q.ops.forEach((o, i) => {
    const L = LET[i]; const el = s.elim.includes(L); const right = s.ok && L === q.gab;
    h += `<label class="op ${el?"elim":""} ${right?"right":""}"><input type="radio" name="r-${id}" value="${L}" ${el||s.ok?"disabled":""} ${right?"checked":""}><span class="L">(${L})</span><span>${o}</span></label>`;
  });
  h += `</div>`;
  const last = s.lastWrong && !s.ok ? s.lastWrong : null;
  if (last) h += `<div class="fb err"><span class="t">Alternativa ${last} não. Veja onde o raciocínio falhou:</span><p>${(q.erros && q.erros[last]) || "Essa alternativa não fecha com o enunciado. Volte às hipóteses da questão e refaça a conta com calma."}</p><p><b>Corrija esse ponto e tente de novo.</b></p></div>`;
  for (let i = 0; i < s.hint && i < q.dicas.length; i++) h += `<div class="fb hint"><span class="t">Dica ${i+1}</span><p>${q.dicas[i]}</p></div>`;
  if (!s.ok) {
    h += `<div class="actions"><button class="btn pri" data-check="${id}">Verificar</button>`;
    if (s.hint < q.dicas.length) h += `<button class="btn warn" data-hint="${id}">${s.hint?"Mais uma dica":"Pedir dica"}</button>`;
    if (s.tries >= 2 && !s.show) h += `<button class="btn" data-ask="${id}">Ver resolução</button>`;
    h += `</div>`;
    if (s.confirm) { const rest = q.ops.length - s.elim.length; h += `<div class="confirm fb note"><p>Você ainda tem ${rest} alternativas possíveis${s.hint<q.dicas.length?" e dicas não usadas":""}. Tentar mais uma vez costuma fixar melhor. Ver a resolução mesmo assim?</p><div class="actions"><button class="btn" data-reveal="${id}">Ver resolução</button><button class="btn pri" data-noreveal="${id}">Vou tentar de novo</button></div></div>`; }
    h += aiBox(id);
  }
  if (s.ok) h += `<div class="fb ok"><span class="t">${s.show && !s.acertou ? "Resolução liberada" : "Correto! Alternativa " + q.gab}</span></div>`;
  if (s.ok || s.show) h += resHtml(q, s);
  return h;
}
function renderVF(q, s, id){
  s.vf = s.vf || {};
  let h = `<p><b>Julgue cada afirmativa (V ou F):</b></p><div class="ops">`;
  q.itens.forEach((it, i) => {
    const v = s.vf[i]; const chk = s.vfchk && s.vfchk[i];
    const cls = chk === undefined ? "" : (chk ? "good" : "bad");
    h += `<div class="vfrow ${cls}"><span>${it.t}</span><span class="seg"><button data-vf="${id}|${i}|1" aria-pressed="${v===true}">V</button><button data-vf="${id}|${i}|0" aria-pressed="${v===false}">F</button></span></div>`;
    if (chk === false) h += `<div class="fb err"><p>${it.erro}</p></div>`;
  });
  h += `</div>`;
  for (let i = 0; i < s.hint && i < q.dicas.length; i++) h += `<div class="fb hint"><span class="t">Dica ${i+1}</span><p>${q.dicas[i]}</p></div>`;
  if (!s.ok) {
    h += `<div class="actions"><button class="btn pri" data-vfcheck="${id}">Verificar</button>${s.hint<q.dicas.length?`<button class="btn warn" data-hint="${id}">Pedir dica</button>`:""}${s.tries>=2&&!s.show?`<button class="btn" data-reveal="${id}">Ver resolução</button>`:""}</div>`;
    h += aiBox(id);
  } else h += `<div class="fb ok"><span class="t">Todas as afirmativas julgadas corretamente</span></div>`;
  if (s.ok || s.show) h += resHtml(q, s);
  return h;
}
function resHtml(q, s){
  let h = `<section class="res"><h4>Resolução comentada</h4>${q.res}`;
  if (q.erros && q.tipo !== "vf") {
    const outros = Object.keys(q.erros).filter(k => k !== q.gab);
    if (outros.length) h += `<div class="whyno"><p><b>Por que as outras não:</b></p>${outros.map(k => `<p><b>(${k})</b> ${q.erros[k]}</p>`).join("")}</div>`;
  }
  return h + `</section>`;
}
function aiBox(id){
  return `<details class="ai" ${sample?"":"hidden"}><summary>Mostre seu raciocínio e receba um diagnóstico</summary>
    <p class="empty">Escreva como você pensou (fórmulas, contas, hipóteses). O diagnóstico aponta o passo que falhou sem entregar a resposta.</p>
    <textarea id="raz-${id}" placeholder="Ex.: usei n = 120f/p com p = 4, achei 1800 rpm e multipliquei por (1 + s)..."></textarea>
    <div class="actions"><button class="btn" data-ai="${id}">Analisar meu raciocínio</button></div>
    <div class="out" id="out-${id}" hidden></div></details>`;
}
const strip = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g," ").trim(); };
async function diagnose(id, btn){
  const q = QS[id]; const ta = $("#raz-"+id); const out = $("#out-"+id);
  const txt = ta.value.trim(); if (!txt) { ta.focus(); return; }
  const s = qs(id);
  const sel = (document.querySelector(`input[name="r-${id}"]:checked`)||{}).value || "nenhuma";
  const ops = q.ops ? q.ops.map((o,i)=>`(${LET[i]}) ${strip(o)}`).join("\n") : q.itens.map((it,i)=>`${i+1}) ${strip(it.t)} [${it.v?"V":"F"}]`).join("\n");
  const prompt = `Você é um tutor de engenharia elétrica que ensina por aprendizagem ativa, em português do Brasil.
Um estudante está resolvendo uma questão de concurso (Transpetro, Engenharia Elétrica).

ENUNCIADO: ${strip(q.enun)}
${q.fig ? "(A questão tem uma figura; use a resolução abaixo para saber o que ela mostra.)" : ""}
ALTERNATIVAS:
${ops}
GABARITO (NÃO REVELE AO ESTUDANTE): ${q.gab || "ver itens"}
RESOLUÇÃO DE REFERÊNCIA (NÃO COPIE): ${strip(q.res)}

Alternativa que o estudante marcou: ${sel}. Alternativas já eliminadas: ${s.elim.join(", ") || "nenhuma"}.
RACIOCÍNIO DO ESTUDANTE:
"""${txt.slice(0, 4000)}"""

Tarefa: aponte com precisão o primeiro ponto em que o raciocínio do estudante falha (conceito, fórmula, hipótese, unidade ou conta) e explique por que está errado. Se o raciocínio estiver correto até onde foi, diga isso e indique o próximo passo.
Regras: NÃO diga qual é a alternativa correta, NÃO dê o valor numérico final, NÃO resolva a questão inteira. Termine com UMA pergunta orientadora que faça o estudante corrigir o erro sozinho. Máximo de 170 palavras, texto simples sem markdown.`;
  btn.disabled = true; out.hidden = false; out.textContent = "Analisando seu raciocínio...";
  try {
    await sample(prompt, {onText: ({text}) => { out.textContent = text; }, cache:false});
  } catch (e) {
    const msg = {not_granted:"Sem permissão para usar o Claude nesta página.", rate_limited:"Muitas análises seguidas. Espere um pouco e tente de novo.", session_expired:"Sua sessão expirou. Entre de novo no claude.ai."}[e && e.code];
    out.textContent = (e && e.text) ? e.text : (msg || "A análise não funcionou agora. Você também pode colar seu raciocínio na conversa com o Claude.");
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) document.querySelectorAll(".ai").forEach(el => el.hidden = true);
  } finally { btn.disabled = false; }
}

function rerenderQ(id){
  const el = $("#q-"+id); if (!el) return;
  const open = el.querySelector("details.ai[open]"); const draft = el.querySelector("textarea") ? el.querySelector("textarea").value : "";
  const outEl = el.querySelector(".ai .out"); const outTxt = outEl && !outEl.hidden ? outEl.textContent : "";
  el.outerHTML = renderQ(id);
  const n = $("#q-"+id);
  const d = n.querySelector("details.ai"); if (d) { d.hidden = !sample; if (open) d.open = true; }
  const ta = n.querySelector("textarea"); if (ta) ta.value = draft;
  if (outTxt) { const o = n.querySelector(".ai .out"); if (o) { o.hidden = false; o.textContent = outTxt; } }
  renderNav();
  const tb = document.querySelector('[data-tab="questoes"]'); if (tb) { const b = BLOCOS.find(x=>x.id===st.last); const s = blockStats(b); tb.textContent = `Questões da prova (${s.ok}/${s.n})`; }
}

/* ---------- eventos ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.b) return openBlock(d.b, "aula");
  if (d.tab) { st.tab = d.tab; save(); renderBlock(); return; }
  if (d.check) {
    const id = d.check, q = QS[id], s = qs(id);
    const sel = document.querySelector(`input[name="r-${id}"]:checked`);
    if (!sel) { const el = $("#q-"+id+" .ops"); el.style.outline = "2px dashed var(--amber)"; setTimeout(()=>el.style.outline="",900); return; }
    s.tries++;
    if (sel.value === q.gab) { s.ok = true; s.acertou = true; s.lastWrong = null; s.confirm = false; }
    else { s.errou = true; s.lastWrong = sel.value; if (!s.elim.includes(sel.value)) s.elim.push(sel.value); }
    save(); rerenderQ(id); return;
  }
  if (d.hint) { const s = qs(d.hint); s.hint++; save(); rerenderQ(d.hint); return; }
  if (d.ask) { const s = qs(d.ask); s.confirm = true; save(); rerenderQ(d.ask); return; }
  if (d.noreveal) { const s = qs(d.noreveal); s.confirm = false; save(); rerenderQ(d.noreveal); return; }
  if (d.reveal) { const s = qs(d.reveal); s.show = true; s.confirm = false; s.lastWrong = null; save(); rerenderQ(d.reveal); return; }
  if (d.vf) { const [id,i,v] = d.vf.split("|"); const s = qs(id); s.vf = s.vf || {}; s.vf[i] = v === "1"; if (s.vfchk) delete s.vfchk[i]; save(); rerenderQ(id); return; }
  if (d.vfcheck) {
    const id = d.vfcheck, q = QS[id], s = qs(id); s.vf = s.vf || {};
    if (q.itens.some((_, i) => s.vf[i] === undefined)) return;
    s.tries++; s.vfchk = {}; let all = true;
    q.itens.forEach((it, i) => { const ok = s.vf[i] === it.v; s.vfchk[i] = ok; if (!ok) all = false; });
    if (all) { s.ok = true; s.acertou = true; } else s.errou = true;
    save(); rerenderQ(id); return;
  }
  if (d.ai) return diagnose(d.ai, t);
  if (d.excheck !== undefined) {
    const b = BLOCOS.find(x=>x.id===st.last); const i = +d.excheck; const p = b.exemplo.passos[i]; const es = st.ex[b.id];
    const inp = $(`#ex-${b.id}-${i}`); const val = inp ? inp.value.trim() : "";
    if (!val) { if (inp) inp.focus(); return; }
    if (p.v === undefined) { es.step = i+1; save(); renderBlock(); return; }
    const x = parseNum(val); const tol = p.tol || 0.02;
    const ok = isFinite(x) && Math.abs(x - p.v) <= Math.abs(p.v)*tol + 1e-9;
    if (ok) es.step = i+1; else es.tries[i] = (es.tries[i]||0) + 1;
    save(); renderBlock();
    const nx = $(`[data-step="${ok?i+1:i}"]`); if (nx) nx.scrollIntoView({block:"nearest"});
    return;
  }
  if (d.exshow !== undefined) { const b = BLOCOS.find(x=>x.id===st.last); st.ex[b.id].step = +d.exshow + 1; save(); renderBlock(); return; }
  if (d.exreset) { const b = BLOCOS.find(x=>x.id===st.last); st.ex[b.id] = {step:0, tries:{}, shown:{}}; save(); renderBlock(); return; }
  if (d.resetall) { if (t.dataset.armed) { st = {q:{}, ex:{}, last:st.last, tab:"aula", filtro:"todas"}; save(); renderNav(); renderBlock(); t.textContent = "Zerar meu progresso"; delete t.dataset.armed; } else { t.dataset.armed = "1"; t.textContent = "Clique de novo para confirmar"; } return; }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "filtro") { st.filtro = ev.target.value; save(); renderBlock(); }
  if (ev.target.id === "msel") openBlock(ev.target.value, "aula");
  if (ev.target.name && ev.target.name.startsWith("r-")) { const id = ev.target.name.slice(2); const s = qs(id); if (s.lastWrong) { s.lastWrong = s.lastWrong; } }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches(".step input")) { const b = ev.target.closest(".step").querySelector("[data-excheck]"); if (b) b.click(); }
});

renderNav(); renderBlock();
})();

</script>
